<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Курс по риичи-маджонгу</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: linear-gradient(160deg, #1a3a2a 0%, #0d1e14 100%); color: #e8e8e8; min-height: 100vh; padding: 1rem 0.75rem; display: flex; justify-content: center; align-items: flex-start; }
.app { width: 100%; max-width: 980px; background: #1f2a25; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); padding: 1.5rem 1.2rem; border: 1px solid #2d3d35; }

.screen { display: none; } .screen.active { display: block; }
h1 { font-size: 1.6rem; font-weight: 700; color: #f5e6c8; text-align: center; margin-bottom: 0.4rem; }
@media (min-width: 720px) { h1 { font-size: 2rem; } }
.subtitle { text-align: center; color: #8aa898; margin-bottom: 1.5rem; font-size: 0.9rem; }
.header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.settings-btn { background: none; border: 1px solid #3d5448; color: #8aa898; font-size: 1.1rem; padding: 0.35rem 0.7rem; border-radius: 8px; cursor: pointer; font-family: inherit; }
.settings-btn:hover { border-color: #d4a373; color: #d4a373; }
.course-hero { display: block; width: 100%; background: linear-gradient(145deg, #1f3a4a 0%, #15232a 100%); border: 3px solid #8ec9e8; border-radius: 18px; padding: 1.5rem 1.4rem; cursor: pointer; transition: all 0.2s; text-align: left; color: #e8e8e8; font-family: inherit; margin-bottom: 1.2rem; }
.course-hero:hover { border-color: #b8dff0; transform: translateY(-2px); box-shadow: 0 12px 36px rgba(142, 201, 232, 0.15); }
.course-hero .icon { font-size: 2.4rem; margin-bottom: 0.4rem; }
.course-hero .title { font-size: 1.35rem; font-weight: 700; color: #8ec9e8; margin-bottom: 0.3rem; }
.course-hero .desc { font-size: 0.85rem; color: #8aa898; line-height: 1.5; margin-bottom: 0.8rem; }
.course-hero .progress-bar { height: 6px; background: #2d3d35; border-radius: 3px; overflow: hidden; }
.course-hero .progress-fill { height: 100%; background: linear-gradient(90deg, #8ec9e8, #6fa8c9); transition: width 0.3s; }
.course-hero .progress-text { font-size: 0.78rem; color: #8aa898; margin-top: 0.4rem; }
.glossary-hero { display: block; width: 100%; background: linear-gradient(145deg, #2a3a1f 0%, #1a2815 100%); border: 3px solid #c8e88e; border-radius: 18px; padding: 1.2rem 1.4rem; cursor: pointer; transition: all 0.2s; text-align: left; color: #e8e8e8; font-family: inherit; margin-bottom: 1.2rem; }
.glossary-hero:hover { border-color: #dff0b8; transform: translateY(-2px); box-shadow: 0 12px 36px rgba(200, 232, 142, 0.15); }
.glossary-hero .icon { font-size: 2rem; margin-bottom: 0.2rem; }
.glossary-hero .title { font-size: 1.15rem; font-weight: 700; color: #c8e88e; margin-bottom: 0.2rem; }
.glossary-hero .desc { font-size: 0.8rem; color: #8aa898; line-height: 1.4; }
.section-label { font-size: 0.85rem; color: #8aa898; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.6rem; margin-top: 0.4rem; }
.practice-grid { display: grid; grid-template-columns: 1fr; gap: 0.6rem; margin-bottom: 1.2rem; }

@media (min-width: 900px) { .practice-grid { grid-template-columns: repeat(4, 1fr); } }
.practice-btn { background: linear-gradient(145deg, #253830 0%, #1a2820 100%); border: 2px solid #3d5448; border-radius: 12px; padding: 1rem 0.9rem; cursor: pointer; transition: all 0.2s; text-align: left; color: #e8e8e8; font-family: inherit; display: flex; align-items: center; gap: 0.7rem; }
.practice-btn:hover { border-color: #d4a373; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212, 163, 115, 0.12); }
.practice-btn .p-icon { font-size: 1.6rem; flex-shrink: 0; }
.practice-btn .p-title { font-size: 0.95rem; font-weight: 600; color: #f5e6c8; margin-bottom: 0.1rem; }
.practice-btn .p-desc { font-size: 0.72rem; color: #8aa898; line-height: 1.35; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; padding-bottom: 0.9rem; border-bottom: 1px solid #2d3d35; gap: 0.5rem; flex-wrap: wrap; }
#btn-back, #btn-lesson-back, #btn-courses-back, #btn-glossary-back { background: none; border: 1px solid #3d5448; color: #8aa898; font-size: 0.9rem; padding: 0.35rem 0.8rem; border-radius: 8px; cursor: pointer; font-family: inherit; }
#btn-back:hover, #btn-lesson-back:hover, #btn-courses-back:hover, #btn-glossary-back:hover { border-color: #d4a373; color: #d4a373; }
.progress { color: #8aa898; font-size: 0.85rem; }
.score { color: #d4a373; font-weight: 600; font-size: 0.9rem; }
.lesson-card { background: linear-gradient(145deg, #253830 0%, #1a2820 100%); border: 2px solid #3d5448; border-radius: 14px; padding: 1.1rem 1.2rem; margin-bottom: 0.75rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 1rem; }
.lesson-card:hover:not(.locked) { border-color: #8ec9e8; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(142, 201, 232, 0.12); }
.lesson-card.locked { opacity: 0.5; cursor: not-allowed; }
.lesson-card.completed { border-color: #5cb85c; }
.lesson-num { width: 42px; height: 42px; border-radius: 50%; background: #3d5448; color: #f5e6c8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.05rem; flex-shrink: 0; }
.lesson-card.completed .lesson-num { background: #2b7a2b; color: #e8f5e8; }
.lesson-card.locked .lesson-num { background: #2d3d35; color: #6a7a72; }
.lesson-info { flex: 1; min-width: 0; }
.lesson-title { font-size: 1rem; font-weight: 600; color: #f5e6c8; margin-bottom: 0.2rem; }
.lesson-desc { font-size: 0.78rem; color: #8aa898; line-height: 1.4; }
.lesson-progress-bar { height: 4px; background: #2d3d35; border-radius: 2px; margin-top: 0.5rem; overflow: hidden; }
.lesson-progress-fill { height: 100%; background: linear-gradient(90deg, #d4a373, #b88a5c); transition: width 0.3s; }
.lesson-card.completed .lesson-progress-fill { background: linear-gradient(90deg, #5cb85c, #2b7a2b); }
.lesson-arrow { color: #8aa898; font-size: 1.2rem; flex-shrink: 0; }
.lesson-header { background: linear-gradient(145deg, #1f3038 0%, #15232a 100%); border-left: 4px solid #8ec9e8; padding: 1rem 1.2rem; border-radius: 0 12px 12px 0; margin-bottom: 1.2rem; }
.lesson-header .l-title { font-size: 1.15rem; font-weight: 600; color: #8ec9e8; margin-bottom: 0.2rem; }
.lesson-header .l-desc { font-size: 0.82rem; color: #8aa898; }
.theory-block { background: #16211b; border-radius: 12px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; line-height: 1.65; font-size: 0.95rem; }
.theory-block h3 { color: #f5e6c8; font-size: 1.05rem; font-weight: 600; margin-bottom: 0.7rem; }
.theory-block p { margin-bottom: 0.7rem; }
.theory-block strong { color: #f5e6c8; }
.theory-block em { color: #d4a373; font-style: normal; font-weight: 600; }
.theory-block ul, .theory-block ol { margin-left: 1.3rem; margin-bottom: 0.7rem; }
.theory-block li { margin-bottom: 0.35rem; }
.theory-block .example { background: rgba(212, 163, 115, 0.08); border-left: 3px solid #d4a373; padding: 0.7rem 1rem; border-radius: 0 8px 8px 0; margin: 0.8rem 0; font-size: 0.9rem; }
.theory-block .example strong { color: #d4a373; }
.theory-block code { background: #2d3d35; padding: 0.1rem 0.4rem; border-radius: 4px; font-family: 'SF Mono', Consolas, monospace; font-size: 0.85em; color: #f5e6c8; }
.theory-block table { width: 100%; border-collapse: collapse; margin: 0.8rem 0; font-size: 0.85rem; }
.theory-block th, .theory-block td { padding: 0.4rem 0.6rem; text-align: left; border-bottom: 1px solid #2d3d35; }
.theory-block th { background: #1f2a25; color: #d4a373; font-weight: 600; }
.quiz-block { background: #16211b; border-radius: 12px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; }
.quiz-block h3 { color: #f5e6c8; font-size: 1.05rem; font-weight: 600; margin-bottom: 0.8rem; }
.quiz-options { display: flex; flex-direction: column; gap: 0.5rem; }
.quiz-option { background: #1f2a25; border: 2px solid #3d5448; border-radius: 10px; padding: 0.8rem 1.1rem; cursor: pointer; transition: all 0.15s; font-family: inherit; color: #e8e8e8; text-align: left; font-size: 0.95rem; }
.quiz-option:hover:not(:disabled) { border-color: #8ec9e8; }
.quiz-option.correct { border-color: #5cb85c; background: rgba(92, 184, 92, 0.1); }
.quiz-option.incorrect { border-color: #d9534f; background: rgba(217, 83, 79, 0.1); }
.quiz-option:disabled { cursor: default; }
.lesson-nav { display: flex; justify-content: space-between; gap: 0.6rem; margin-top: 1.5rem; flex-wrap: wrap; }
.lesson-nav .nav-right { display: flex; gap: 0.6rem; margin-left: auto; }
.lesson-progress-dots { display: flex; gap: 0.4rem; justify-content: center; margin: 1rem 0; }
.lesson-dot { width: 8px; height: 8px; border-radius: 50%; background: #2d3d35; transition: all 0.2s; }
.lesson-dot.active { background: #8ec9e8; transform: scale(1.3); }
.lesson-dot.done { background: #5cb85c; }
.lesson-complete-banner { background: linear-gradient(145deg, #2b4a2b, #1a3a1a); border: 2px solid #5cb85c; border-radius: 14px; padding: 1.5rem; text-align: center; margin-bottom: 1.2rem; }
.lesson-complete-banner .icon { font-size: 3rem; margin-bottom: 0.5rem; }
.lesson-complete-banner h3 { color: #7fd87f; font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
.lesson-complete-banner p { color: #b8d8b8; font-size: 0.9rem; line-height: 1.5; }
.hand { display: flex; flex-wrap: wrap; gap: 4px; margin: 0.8rem 0; padding: 1rem 0.6rem; background: #16211b; border-radius: 12px; min-height: 70px; align-items: center; justify-content: center; }
.tile { width: 40px; height: 54px; background: linear-gradient(170deg, #fdfdfa 0%, #e8e4d8 100%); border-radius: 5px; border: 1px solid #b8b0a0; box-shadow: 0 2px 0 #a89e8a, 0 3px 5px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; transition: all 0.12s; user-select: none; flex-shrink: 0; }
@media (min-width: 720px) { .tile { width: 46px; height: 62px; } .tile .num { font-size: 1.35rem; } .tile .honor { font-size: 1.35rem; } .tile .honor.honor-wide { font-size: 1rem; } }
.tile .num { font-size: 1.2rem; line-height: 1; }
.tile .suit { font-size: 0.6rem; line-height: 1; margin-top: 2px; opacity: 0.9; font-weight: 700; letter-spacing: 0.02em; }
.tile .honor { font-size: 1.2rem; line-height: 1; font-weight: 700; }
.tile .honor.honor-wide { font-size: 0.85rem; letter-spacing: -0.02em; }
.tile.m .num, .tile.m .suit { color: #b83a3a; }
.tile.p .num, .tile.p .suit { color: #2a6f8f; }
.tile.s .num, .tile.s .suit { color: #2b7a2b; }
.tile.z .honor { color: #333; }
.tile.z[data-code="5z"] .honor { color: #999; }
.tile.z[data-code="6z"] .honor { color: #2b7a2b; }
.tile.z[data-code="7z"] .honor { color: #b83a3a; }
.tile.clickable:hover, .tile.clickable:active { transform: translateY(-3px); box-shadow: 0 5px 0 #a89e8a, 0 6px 10px rgba(0,0,0,0.4); }
.tile.selected { border-color: #d4a373; box-shadow: 0 0 0 2px #d4a373, 0 3px 0 #a89e8a; transform: translateY(-3px); }
.tile.correct { border-color: #5cb85c; box-shadow: 0 0 0 3px #5cb85c, 0 2px 0 #a89e8a; }
.tile.incorrect { border-color: #d9534f; box-shadow: 0 0 0 3px #d9534f, 0 2px 0 #a89e8a; }
.tile.disabled { cursor: default; opacity: 0.9; }
.tile.small { width: 30px; height: 40px; }
.tile.small .num { font-size: 0.9rem; }
.tile.small .honor { font-size: 0.9rem; }
.tile.small .honor.honor-wide { font-size: 0.7rem; }
.tile.small .suit { font-size: 0.5rem; margin-top: 0; }
.question { font-size: 0.98rem; line-height: 1.55; color: #e8e8e8; margin-bottom: 1rem; }
.question strong { color: #f5e6c8; }
.palette-label { font-size: 0.8rem; color: #8aa898; margin-bottom: 0.4rem; margin-top: 0.6rem; }
.palette { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 0.8rem; padding: 0.6rem; background: #16211b; border-radius: 12px; justify-content: center; }
.palette .suit-group { display: flex; gap: 3px; margin-right: 6px; }
.palette .suit-group:last-child { margin-right: 0; }
.feedback { margin-top: 1rem; padding: 0.9rem 1rem; border-radius: 12px; line-height: 1.55; font-size: 0.88rem; }
.feedback.correct { background: rgba(92, 184, 92, 0.12); border-left: 4px solid #5cb85c; }
.feedback.incorrect { background: rgba(217, 83, 79, 0.12); border-left: 4px solid #d9534f; }
.feedback .headline { font-weight: 700; font-size: 0.98rem; margin-bottom: 0.4rem; }
.feedback.correct .headline { color: #7fd87f; }
.feedback.incorrect .headline { color: #e88884; }
.feedback .answer-block { margin: 0.5rem 0; padding: 0.5rem 0.7rem; background: rgba(0,0,0,0.25); border-radius: 8px; font-size: 0.85rem; }
.actions { margin-top: 1.2rem; display: flex; gap: 0.6rem; justify-content: flex-end; flex-wrap: wrap; }
button.primary { background: linear-gradient(145deg, #d4a373, #b88a5c); color: #1a1a1a; border: none; padding: 0.7rem 1.5rem; font-size: 0.95rem; font-weight: 600; border-radius: 10px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
button.primary:hover:not(:disabled) { filter: brightness(1.1); }
button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
button.secondary { background: transparent; color: #8aa898; border: 1px solid #3d5448; padding: 0.7rem 1.2rem; font-size: 0.95rem; border-radius: 10px; cursor: pointer; font-family: inherit; }
button.secondary:hover { border-color: #d4a373; color: #d4a373; }
button.danger { background: transparent; color: #e88884; border: 1px solid #6f3a3a; padding: 0.7rem 1.2rem; font-size: 0.95rem; border-radius: 10px; cursor: pointer; font-family: inherit; }
button.danger:hover { background: rgba(217, 83, 79, 0.1); }
.results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin: 1.2rem 0; }
.result-card { background: #16211b; padding: 1rem; border-radius: 12px; text-align: center; }
.result-card .value { font-size: 1.6rem; font-weight: 700; color: #d4a373; }
.result-card .label { font-size: 0.78rem; color: #8aa898; margin-top: 0.2rem; }
.result-message { text-align: center; padding: 1rem; background: linear-gradient(145deg, #253830, #1a2820); border-radius: 12px; margin-bottom: 1rem; font-size: 0.95rem; line-height: 1.5; }
.loading { text-align: center; padding: 2rem; color: #8aa898; font-size: 0.9rem; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #3d5448; border-top-color: #d4a373; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.settings-section { background: #16211b; border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
.settings-section h3 { font-size: 0.95rem; color: #d4a373; margin-bottom: 0.8rem; }
.settings-section .desc { font-size: 0.82rem; color: #8aa898; line-height: 1.5; margin-bottom: 0.8rem; }
.settings-section .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
input[type="file"] { display: none; }
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #253830; border: 1px solid #d4a373; color: #f5e6c8; padding: 0.7rem 1.2rem; border-radius: 10px; font-size: 0.9rem; z-index: 9999; box-shadow: 0 8px 24px rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
.hint-row { font-size: 0.72rem; color: #6a7a72; margin-top: 0.4rem; text-align: right; }
.stats-mini { display: flex; justify-content: space-around; padding: 0.7rem; background: #16211b; border-radius: 10px; font-size: 0.8rem; color: #8aa898; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
.stats-mini span strong { color: #d4a373; }
.term-glossary { margin-top: 1.5rem; padding: 1rem 1.2rem; background: linear-gradient(145deg, #1f3038 0%, #15232a 100%); border-radius: 12px; border-left: 4px solid #8ec9e8; }
.term-glossary h4 { color: #8ec9e8; font-size: 0.95rem; margin-bottom: 0.7rem; }
.glossary-item-inline { font-size: 0.85rem; color: #b8c8d8; line-height: 1.55; padding: 0.4rem 0; border-bottom: 1px solid #2d3d35; }
.glossary-item-inline:last-child { border-bottom: none; }
.glossary-item-inline strong { color: #f5e6c8; margin-right: 0.3rem; }
.discard-row { display: flex; flex-wrap: wrap; gap: 2px; padding: 0.6rem 0.4rem; background: #0d1e14; border-radius: 8px; margin-bottom: 0.8rem; min-height: 44px; align-items: center; }
.candidates-label { font-size: 0.85rem; color: #d4a373; margin-bottom: 0.4rem; font-weight: 600; }
/* Full glossary screen */
.gloss-search-wrap { position: sticky; top: 0; z-index: 10; background: #1f2a25; padding: 0.8rem 0; margin-bottom: 0.6rem; }
.gloss-search-input { width: 100%; background: #16211b; border: 2px solid #3d5448; border-radius: 10px; padding: 0.7rem 1rem; font-size: 1rem; color: #e8e8e8; font-family: inherit; outline: none; transition: border-color 0.15s; }
.gloss-search-input:focus { border-color: #8ec9e8; }
.gloss-search-input::placeholder { color: #6a7a72; }
.gloss-info-row { font-size: 0.78rem; color: #8aa898; margin-top: 0.4rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
.gloss-clear-btn { background: none; border: 1px solid #3d5448; color: #8aa898; font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 6px; cursor: pointer; font-family: inherit; }
.gloss-clear-btn:hover { border-color: #d4a373; color: #d4a373; }

.gloss-cat-btn { background: #16211b; border: 1px solid #3d5448; color: #8aa898; font-size: 0.75rem; padding: 0.3rem 0.7rem; border-radius: 20px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.gloss-cat-btn:hover { border-color: #8ec9e8; color: #8ec9e8; }
.gloss-cat-btn.active { background: #8ec9e8; border-color: #8ec9e8; color: #1a3a2a; font-weight: 600; }
.gloss-section-title { color: #8ec9e8; font-size: 1rem; font-weight: 700; margin: 1.2rem 0 0.6rem; padding-bottom: 0.4rem; border-bottom: 2px solid #2d3d35; display: flex; align-items: center; gap: 0.5rem; }
.gloss-section-title .count { font-size: 0.72rem; color: #6a7a72; font-weight: 400; }
.gloss-full-list { display: flex; flex-direction: column; gap: 0.5rem; }
.gloss-full-item { background: #1f2a25; border: 1px solid #2d3d35; border-left: 3px solid #8ec9e8; border-radius: 10px; padding: 0.85rem 1rem; transition: all 0.15s; }
.gloss-full-item:hover { border-left-color: #d4a373; background: #232c37; }
.gloss-full-item .term { font-size: 0.98rem; font-weight: 700; color: #f5e6c8; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.gloss-full-item .term .ja { font-size: 0.82rem; color: #8aa898; font-weight: 400; }
.gloss-full-item .definition { font-size: 0.86rem; color: #b8c8d8; line-height: 1.55; }
.gloss-no-results { text-align: center; padding: 2.5rem 1rem; color: #6a7a72; font-size: 0.95rem; }
.gloss-no-results .icon { font-size: 2.5rem; margin-bottom: 0.6rem; opacity: 0.5; }
mark { background: rgba(212, 163, 115, 0.35); color: #f5e6c8; padding: 0.05rem 0.2rem; border-radius: 3px; }
</style>
</head>
<body>
<div class="app">

    <div class="screen active" id="screen-home">
        <div class="header-row">
            <div style="width: 40px;"></div>
            <h1 style="margin: 0;">Курс по риичи-маджонгу</h1>
            <button class="settings-btn" id="btn-open-settings" title="Настройки">⚙️</button>
        </div>
        <p class="subtitle">От полного нуля до уверенного игрока · 24 урока</p>

        <button class="course-hero" id="btn-open-course">

        let guard2 = 0;
        while (discardSet.size < targetDiscardSize && guard2 < 100) {
            guard2++;
            const suit = pick(suits, rng);
            const num = 1 + Math.floor(rng() * 9);
            discardSet.add(num + suit);
        }
        const opponentDiscard = shuffle([...discardSet], rng);
        const sujiSet = computeSuji(opponentDiscard);
        const discardSetFinal = new Set(opponentDiscard);
        const gembutsuCandidates = [...discardSetFinal];
        if (gembutsuCandidates.length === 0) continue;
        const gembutsu = pick(gembutsuCandidates, rng);
        const sujiCandidates = [...sujiSet].filter(t => !discardSetFinal.has(t) && t !== gembutsu);
        if (sujiCandidates.length < 2) continue;
        const shuffledSuji = shuffle(sujiCandidates, rng);
        const sujiTile1 = shuffledSuji[0];
        const sujiTile2 = shuffledSuji[1];
        const dangerousCandidates = [];
        for (const suit of suits) {
            for (const num of [4, 5, 6]) {
                const tile = num + suit;
                if (!discardSetFinal.has(tile) && !sujiSet.has(tile) && tile !== gembutsu && tile !== sujiTile1 && tile !== sujiTile2) {
                    dangerousCandidates.push(tile);
                }
            }
        }
        if (dangerousCandidates.length === 0) continue;
        const dangerousTile = pick(dangerousCandidates, rng);
        const candidates = shuffle([gembutsu, sujiTile1, sujiTile2, dangerousTile], rng);
        return {
            hand: candidates,
            opponentDiscard,
            correctAnswer: dangerousTile,
            safeDiscards: [gembutsu, sujiTile1, sujiTile2],
            sujiSet: [...sujiSet],
            tags: ['discard-reading'],
            explain: `<strong>Самый опасный тайл — ${humanizeTile(dangerousTile)}</strong>: центральный тайл без защиты. Против этого дискарда безопасны: <strong>${humanizeTile(gembutsu)}</strong> (гэмбуцу — противник уже сбрасывал), <strong>${humanizeTile(sujiTile1)}</strong> и <strong>${humanizeTile(sujiTile2)}</strong> (судзи от сброшенных тайлов).`
        };
    }
    return null;
}

/* Дублируем для inline-глоссария по ключу */
const TERMS = {};
for (const g of GLOSSARY) {
    if (!TERMS[g.term.toLowerCase()]) TERMS[g.term.toLowerCase()] = g.def;
}

/* ============ INLINE GLOSSARY ============ */
function renderGlossary(container, text) {
    const lower = text.toLowerCase();
    const found = [];
    for (const [key, val] of Object.entries(TERMS)) {
        try {
            const re = new RegExp('(?<![а-яё])' + escapeRegex(key) + '(?![а-яё])', 'i');
            if (re.test(lower)) found.push([key, val]);
        } catch (e) {
            const idx = lower.indexOf(key);
            if (idx !== -1) {
                const before = idx === 0 ? ' ' : lower[idx - 1];
                const after = idx + key.length >= lower.length ? ' ' : lower[idx + key.length];
                const isBoundary = (c) => !/[а-яё]/.test(c);
                if (isBoundary(before) && isBoundary(after)) found.push([key, val]);
            }
        }
    }
    if (found.length === 0) return;
    const div = document.createElement('div');
    div.className = 'term-glossary';
    div.innerHTML = '<h4>📖 Термины в этом уроке</h4>' +
        found.map(([k, v]) => `<div class="glossary-item-inline"><strong>${k}</strong> — ${v}</div>`).join('');
    container.appendChild(div);
}

        { hand: "234m 567m 22p 88p 34s 6z 9m", best: ["9m"], explain: "9M — терминал. Сброс 9M." },
        { hand: "123m 456m 111p 234s 5z 9m", best: ["9m"], explain: "9M — терминал. Сброс 9M." }
      ], intro: "Практика: сложные формы." }
  ] },

{ id: "lesson-06", title: "Теория 5 блоков", desc: "Основа эффективного сбора", prereqs: ["lesson-05"],
  blocks: [
    { type: "theory", title: "Что такое блок", html: `<p><strong>Блок</strong> — группа тайлов, которая может стать сетом или парой.</p>
      <ul>
        <li><strong>Готовый сет</strong> — например 3-4-5M.</li>
        <li><strong>Пара</strong> — например Wh-Wh.</li>
        <li><strong>Рянмен</strong> — 3-4M.</li>
        <li><strong>Канчан</strong> — 2-4M.</li>
        <li><strong>Пенчан</strong> — 1-2M.</li>
        <li><strong>Опорный тайл</strong> — одиночная 5P.</li>
      </ul>` },
    { type: "theory", title: "Всегда 5 блоков", html: `<p>Для победы нужны <strong>4 сета и пара</strong>. Значит, в руке должно быть <strong>ровно 5 блоков</strong>.</p>
      <ul>
        <li><strong>5 блоков</strong> — идеально.</li>
        <li><strong>6+ блоков</strong> — избыток. Режьте слабейший.</li>
        <li><strong>4 блока</strong> — дефицит. Создавайте новые.</li>
      </ul>
      <div class="example"><strong>Правило:</strong> 5 сильных блоков лучше 6 слабых.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Пять блоков + два одиночных дракона. Сбрасываем 3W." },
        { hand: "123m 456m 789m 12p 78s 5z", best: ["5z"], explain: "Пять блоков. Лишний — Wh." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — изолированный терминал." }
      ], intro: "Практика: применяйте логику блоков." },
    { type: "theory", title: "Как резать слабый блок", html: `<ul>
        <li><strong>Рянмен</strong> — 8 тайлов уке-ире. Сильнейший.</li>
        <li><strong>Сянпон</strong> — 4 тайла.</li>
        <li><strong>Канчан</strong> — 4 тайла. Улучшается до рянмена.</li>
        <li><strong>Пенчан</strong> — 4 тайла. Улучшается сложно.</li>
      </ul>
      <div class="example"><strong>Пример:</strong> между канчаном 3-5 и канчаном 2-4 режьте 2-4 — у 3-5 больше улучшений.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 24s 88s 5z 3z", best: ["3z"], explain: "Пять блоков. Лишняя — 3W." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 12s 22z 5z 9m", best: ["9m"], explain: "9M — терминал." }
      ], intro: "Практика: сложные развилки." },
    { type: "quiz", title: "Сколько блоков оптимально?", options: ["3","4","5","6"], correct: 2,
      explain: "5 блоков = 4 сета + пара." }
  ] },

{ id: "lesson-07", title: "Классификация ишантэнов", desc: "Три типа: с парой, хэддоресу, куццуки", prereqs: ["lesson-06"],
  blocks: [
    { type: "theory", title: "Три типа ишантэнов", html: `<p><strong>Ишантэн</strong> — рука, до темпая которой остался один тайл. Три типа:</p>
      <ol>
        <li><strong>С двумя сетами и парой</strong> — самый частый. Готовы 2 сета + пара, есть 2 заготовки.</li>
        <li><strong>Хэддоресу</strong> — без пары. Готовы 3 сета, нужно найти пару.</li>
        <li><strong>Куццуки</strong> — без одного тацу. Готовы 3 сета + пара, есть 2 плавающих тайла.</li>
      </ol>
      <div class="example"><strong>По силе:</strong> куццуки > хэддоресу > с двумя сетами и парой. Пару заиметь легче, чем сет.</div>` },
    { type: "theory", title: "Ишантэн с двумя сетами и парой", html: `<p>Самый распространённый тип. Главный выбор: <em>пронести тацу</em>, <em>зафиксировать тацу</em> или <em>снести плавающий тайл</em>.</p>
      <p>В начале раздачи играем по уке, в середине — улучшаем формы, в конце — стремимся к формальному темпаю.</p>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сбрасываем слабейший одиночный дракон." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 12s 22z 5z 9m", best: ["9m"], explain: "9M — терминал." }
      ], intro: "Практика: ишантэн с двумя сетами и парой." },
    { type: "theory", title: "Хэддоресу и куццуки", html: `<p><strong>Хэддоресу</strong> — без пары. Ценность форм, из которых легко получить пару (напр. 7899, 3335), возрастает.</p>
      <p><strong>Куццуки</strong> — с парой, но без одного тацу. Два плавающих тайла могут присоединиться к другим формам. Считается лучшим ишантэном.</p>
      <div class="example"><strong>Совет:</strong> имея хэддоресу, ищите формы, которые легко дают пару.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — изолированный терминал." },
        { hand: "123m 456m 78m 234p 5z 5z 1z", best: ["1z"], explain: "1E — одиночная ветровая." },
        { hand: "234m 567m 78p 34s 55s 6z 9m", best: ["9m"], explain: "9M — терминал." }
      ], intro: "Практика: хэддоресу и куццуки." },
    { type: "quiz", title: "Какой ишантэн самый сильный?", options: ["С двумя сетами и парой","Хэддоресу","Куццуки","Все равны"], correct: 2,
      explain: "Куццуки: готовы 3 сета + пара, плюс два плавающих тайла." }
  ] },

{ id: "lesson-08", title: "Выбор ожидания", desc: "Стоимость vs процент побед", prereqs: ["lesson-07"],
  blocks: [
    { type: "theory", title: "Сянпон выгоднее канчана", html: `<p>При одинаковом количестве аутов <strong>сянпон</strong> имеет больший процент побед, чем канчан.</p>
      <p>Исключения: дыра на 2-ку без залома лучше сянпона на 3-7; дыра на 3-ку лучше сянпона на 4-5-6.</p>` },
    { type: "theory", title: "Таблица процентов побед", html: `<p>Проценты побед для разных ожиданий (риичи на 6-10 ходу):</p>
      <table>
        <tr><th>Ожидание</th><th>4 аута</th><th>3 аута</th><th>2 аута</th></tr>
        <tr><td>1,9 без залома</td><td>—</td><td>50.1</td><td>41.6</td></tr>
        <tr><td>2,8 без залома</td><td>42.0</td><td>38.2</td><td>31.7</td></tr>
        <tr><td>3,7 без залома</td><td>36.8</td><td>32.0</td><td>25.5</td></tr>
        <tr><td>4,5,6 без залома</td><td>31.0</td><td>26.7</td><td>20.3</td></tr>
        <tr><td>1,9 с заломом</td><td>—</td><td>67.9</td><td>60.0</td></tr>
      </table>
      <div class="example"><strong>Как считать сянпон:</strong> P + Q − (P·Q)/100.</div>` },
    { type: "practice", mode: "waits", tasks: [
        { hand: "234m 567m 78p 234s 55z", waits: ["6p","9p"], explain: "Рянмен 7-8P ждёт 6P или 9P." },
        { hand: "123m 456m 789m 24p 55s", waits: ["3p"], explain: "Канчан 2-4P ждёт только 3P." },
        { hand: "123m 456m 789m 22p 55s", waits: ["2p","5s"], explain: "Сянпон. С учётом двух пар процент сопоставим с рянменом." }
      ], intro: "Практика: сравните типы ожиданий." },
    { type: "theory", title: "Стоимость vs процент побед", html: `<ul>
        <li>Для закрытой руки от 3-30, открытой от 3-40: при небольшой разнице выбирайте <strong>хорошее ожидание</strong>.</li>
        <li>Если плохое ожидание даёт +1 хан и 10 фу — <strong>дорогой вариант</strong>.</li>
        <li>Открытая рука: 1000 — хорошее ожидание; 3900 с плохим лучше 2000 с хорошим.</li>
      </ul>
      <div class="example"><strong>5-я основа сбора:</strong> ожидание лучше рянмена и стоимость выше мангана не стоят потерь в скорости.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сбрасываем слабейший одиночный дракон." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал." }
      ], intro: "Финальная практика: выбор между стоимостью и ожиданием." },
    { type: "quiz", title: "Что важнее для руки манган и выше?", options: ["Стоимость","Количество аутов","Защита","Ничего"], correct: 1,
      explain: "Для рук от мангана и выше количество аутов важнее роста стоимости." }
  ] },

/* МОДУЛЬ 3 */
{ id: "lesson-09", title: "Базовые ожидания", desc: "Танки, канчан, пенчан, рянмен", prereqs: ["lesson-08"],
  blocks: [
    { type: "theory", title: "Четыре базовых ожидания", html: `<ul>
        <li><strong>Танки</strong> — ожидание в пару. <em>3 тайла</em>.</li>
        <li><strong>Канчан</strong> — ожидание в середину (2-4M ждёт 3M). <em>4 тайла</em>.</li>
        <li><strong>Пенчан</strong> — краевое (1-2M ждёт 3M). <em>4 тайла</em>.</li>
        <li><strong>Рянмен</strong> — двустороннее (3-4M ждёт 2M и 5M). <em>8 тайлов</em>.</li>
      </ul>
      <div class="example"><strong>Итог:</strong> рянмен даёт в 2 раза больше шансов, чем канчан или пенчан.</div>` },
    { type: "practice", mode: "waits", tasks: [
        { hand: "234m 567m 78p 234s 55z", waits: ["6p","9p"], explain: "Рянмен 7-8P ждёт 6P или 9P." },
        { hand: "123m 456m 789m 24p 55s", waits: ["3p"], explain: "Канчан 2-4P ждёт только 3P." },
        { hand: "123m 456m 789m 22p 55s", waits: ["2p","5s"], explain: "Сянпон: 2P или 5S." }
      ], intro: "Практика: определите тип ожидания." },
    { type: "theory", title: "Когда объявлять риичи", html: `<p>Риичи всегда выгодно, если:</p>
      <ul>
        <li>У вас хорошее ожидание (рянмен и шире).</li>
        <li>Рука стоит 2+ хана или есть доры.</li>
        <li>Вы в темпае без яку — риичи даёт вам яку.</li>
      </ul>
      <p>Избегайте риичи при плохом ожидании и дешёвой руке.</p>` },
    { type: "practice", mode: "waits", tasks: [
        { hand: "123m 456m 11p 456s 78s", waits: ["6s","9s"], explain: "Рянмен 7-8S ждёт 6S или 9S." },
        { hand: "123m 456m 789m 123p 1s", waits: ["1s"], explain: "Танки на 1S." },
        { hand: "234m 234p 234s 55z 66s", waits: ["5z","6s"], explain: "Сянпон: 5Z или 6S (две пары)." }
      ], intro: "Практика: работа с темпай-руками." },
    { type: "quiz", title: "Какое ожидание самое сильное?", options: ["Танки","Канчан","Пенчан","Рянмен"], correct: 3,
      explain: "Рянмен ждёт два вида тайлов (до 8 штук)." }
  ] },

{ id: "lesson-10", title: "Множественные ожидания", desc: "Санмэнчан, нобетан и сложные формы", prereqs: ["lesson-09"],
  blocks: [
    { type: "theory", title: "Санмэнчан", html: `<p><strong>Санмэнчан</strong> — пять подряд идущих тайлов в одной масти, например 2-3-4-5-6M.</p>
      <p>Эту форму можно разложить тремя способами:</p>
      <ul>
        <li>2-3 + 4-5-6 → ждёт 1M и 4M.</li>
        <li>2-3-4 + 5-6 → ждёт 4M и 7M.</li>
        <li>2-3-4-5 + 6 → ждёт 6M (танки).</li>
      </ul>
      <p>Итого: <strong>1M, 4M, 7M</strong> — до <em>12 тайлов</em>.</p>` },
    { type: "quiz", title: "Сколько видов тайлов ждёт санмэнчан 2-3-4-5-6?", options: ["1","2","3","5"], correct: 2,
      explain: "Санмэнчан ждёт три вида тайлов — 1, 4 и 7." },
    { type: "theory", title: "Нобетан и другие формы", html: `<p><strong>Нобетан</strong> — четыре подряд идущих тайла, например 2-3-4-5M. Ждёт 2M или 5M (6 тайлов).</p>
      <p>Другие формы:</p>
      <ul>
        <li><strong>Рянмен + сянпон</strong> — комбинация двух ожиданий.</li>
        <li><strong>Тацумаки</strong> — сложная комбинация в одной масти.</li>
      </ul>
      <div class="example"><strong>Совет:</strong> длинные формы всегда проверяйте на множественные ожидания.</div>` },
    { type: "practice", mode: "waits", tasks: [
        { hand: "123m 456m 789m 22p 34s", waits: ["2p","2s","5s"], explain: "Разложение: 22P + 34S. Сянпон на 2P или рянмен 2S/5S." },
        { hand: "23456m 234p 567p 88s", waits: ["1m","4m","7m"], explain: "Санмэнчан 2-3-4-5-6M." },
        { hand: "123m 456m 789m 22p 5z 5z", waits: ["2p","5z"], explain: "Сянпон: 2P или 5Z." }
      ], intro: "Практика: сложные ожидания." },
    { type: "theory", title: "Практика распознавания", html: `<p>Чтобы быстро определять множественные ожидания:</p>
      <ol>
        <li>Смотрите на длинные масти (5+ тайлов подряд).</li>
        <li>Мысленно сдвигайте границы сетов на 1 тайл.</li>
        <li>Каждое разложение даёт новый выигрышный тайл.</li>
      </ol>` },
    { type: "practice", mode: "waits", tasks: [
        { hand: "123m 234m 345m 99p 11s", waits: ["1s","9p"], explain: "Иццу в манах. Сянпон: 1S или 9P." },
        { hand: "456m 456p 456s 99s 55p", waits: ["5p","9s"], explain: "Саншоку. Сянпон: 5P или 9S." },
        { hand: "11m 234m 567m 88p 234s", waits: ["1m","8p"], explain: "Сянпон: 1M или 8P." }
      ], intro: "Финальная практика урока." }
  ] },

{ id: "lesson-11", title: "Яку и стратегия", desc: "Таняо, пинфу, якухай, иппэйко", prereqs: ["lesson-10"],
  blocks: [
    { type: "theory", title: "Основные яку", html: `<ul>
        <li><strong>Таняо</strong> — все тайлы 2–8. +1 хан.</li>
        <li><strong>Пинфу</strong> — все сеты последовательности, пара не дракон/ветер. +1 хан.</li>
        <li><strong>Якухай</strong> — пон драконов или ветра раунда. +1 хан.</li>
        <li><strong>Иппэйко</strong> — две одинаковые последовательности. +1 хан.</li>
        <li><strong>Саншоку</strong> — одинаковые последовательности в трёх мастях. +2 хана (закрытая) / +1 (открытая).</li>
        <li><strong>Иццу</strong> — 1-2-3, 4-5-6, 7-8-9 в одной масти. +2 хана (закрытая) / +1 (открытая).</li>
        <li><strong>Чанта</strong> — все сеты содержат 1 или 9. +2 хана (закрытая) / +1 (открытая).</li>
      </ul>` },
    { type: "theory", title: "Когда какое яку собирать", html: `<ul>
        <li><strong>Пинфу</strong> — самое универсальное. Стремитесь к нему, если форма позволяет.</li>
        <li><strong>Таняо</strong> — легко комбинируется с пинфу и риичи.</li>
        <li><strong>Якухай</strong> — для открытых рук или быстрых побед.</li>
        <li><strong>Иппэйко</strong> — бонус, не цель.</li>
        <li><strong>Саншоку и иццу</strong> — дорогие яку, но требуют специфических форм.</li>
      </ul>
      <div class="example"><strong>Совет:</strong> если не уверены — стремитесь к пинфу + риичи.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сбрасываем слабейший одиночный дракон. Целимся в пинфу." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал." }
      ], intro: "Практика: выбор яку и сброс под него." },
    { type: "quiz", title: "Какое яку самое универсальное?", options: ["Таняо","Пинфу","Якухай","Иппэйко"], correct: 1,
      explain: "Пинфу подходит почти для любой руки и комбинируется с риичи, таняо, саншоку." }
  ] },

{ id: "lesson-12", title: "Дора и акадора", desc: "Как встраивать, когда жертвовать", prereqs: ["lesson-11"],
  blocks: [
    { type: "theory", title: "Дора", html: `<p><strong>Дора</strong> — бонусный тайл, указанный в открытой карте. +1 хан за каждый.</p>
      <p><strong>Ура-дора</strong> — дора, открываемая только после риичи.</p>
      <p>Дора может значительно увеличить стоимость руки. Но не стоит жертвовать скоростью ради одной доры.</p>
      <div class="example"><strong>Правило:</strong> если дора — центральный тайл, он ценнее.</div>` },
    { type: "theory", title: "Акадора", html: `<p><strong>Акадора</strong> — красная 5 (обычно одна на масть). Даёт +1 хан.</p>
      <p>Акадора — мощный инструмент, но её сложно встроить. Если акадора — ваша единственная дора, и рука плохая — жертвуйте ради скорости.</p>
      <div class="example"><strong>Совет:</strong> акадору стоит оставлять, если она встраивается без потерь.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сброс слабейшего дракона. Доры нет — целимся в скорость." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M — центральный. 1E — одиночная ветровая." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал." }
      ], intro: "Практика: работа с дорами." },
    { type: "theory", title: "Когда жертвовать дорой", html: `<ul>
        <li>Если дора — единственный полезный тайл, но рука далека от темпая — жертвуйте.</li>
        <li>Если дора встраивается в форму — оставляйте.</li>
        <li>Если у вас уже есть 2+ доры — можно жертвовать одной ради формы.</li>
      </ul>` },
    { type: "quiz", title: "Когда стоит жертвовать дорой?", options: ["Всегда","Никогда","Если она не встраивается без потерь","Только в орасу"], correct: 2,
      explain: "Дора — ценный ресурс, но если она не встраивается без потери скорости, ей можно пожертвовать." }
  ] },

/* МОДУЛЬ 4 */
{ id: "lesson-13", title: "Отступить или надавить", desc: "4 параметра решения (Фукути)", prereqs: ["lesson-12"],
  blocks: [
    { type: "theory", title: "4 параметра решения", html: `<p>По книге Фукути, решение «отступить или надавить» определяется 4 параметрами:</p>
      <ol>
        <li><strong>Стоимость нашей руки.</strong> Чем дороже — тем выгоднее атаковать.</li>
        <li><strong>Качество ожидания.</strong> Рянмен и лучше — атакуем; канчан — осторожнее.</li>
        <li><strong>Близость к темпаю (шантэн).</strong> Темпай — атакуем; 1-шантэн — думаем; 2+ — защищаемся.</li>
        <li><strong>Текущее место в ханчане.</strong> 1-е место — осторожнее; 4-е — агрессивнее.</li>
      </ol>
      <div class="example"><strong>Правило:</strong> сочетание этих параметров определяет решение.</div>` },
    { type: "quiz", title: "Сколько параметров определяют решение отступить/надавить?", options: ["2","3","4","5"], correct: 2,
      explain: "4 параметра: стоимость, ожидание, близость к темпаю, место." },
    { type: "theory", title: "Правила 1-4 (Фукути)", html: `<ol>
        <li><strong>Пинфу номи — строго даматэн — пережиток прошлого.</strong> Опережающее риичи на пинфу — супер плюсово.</li>
        <li><strong>Догоняющее с пинфу — только до 9-го хода.</strong></li>
        <li><strong>Не кидаем риичи пинфу против дилерского риичи.</strong></li>
        <li><strong>Пинфу дора — всегда риичи.</strong></li>
      </ol>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сбрасываем 3W. Целимся в пинфу." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал." }
      ], intro: "Практика: применяйте правила 1-4." },
    { type: "theory", title: "Правила 5-11 (Фукути)", html: `<ol start="5">
        <li><strong>Быстрая номи рука с рянменом — железное риичи.</strong></li>
        <li><strong>Медленная номи рука с рянменом — по дефолту риичи.</strong></li>
        <li><strong>Догоняющее риичи номи в рянмен — сложно. Против дилера лучше отступить.</strong></li>
        <li><strong>Номи рука с канчаном — риичи нельзя.</strong></li>
        <li><strong>Дилерское риичи номи с канчаном — поступайте как нравится.</strong></li>
        <li><strong>Риичи номи с перспективным канчаном — поступайте как нравится.</strong></li>
        <li><strong>Дилерское риичи номи с перспективным канчаном — риичи.</strong></li>
      </ol>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сброс слабейшего дракона." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал." }
      ], intro: "Финальная практика: применяйте все правила." }

{ id: "lesson-14", title: "Риичи: когда кидать, когда нет", desc: "Даматэн и правила Фукути", prereqs: ["lesson-13"],
  blocks: [
    { type: "theory", title: "Плюсы и минусы риичи", html: `<p><strong>Плюсы:</strong></p>
      <ul>
        <li>+1 хан к стоимости.</li>
        <li>Доступ к ура-дорам.</li>
        <li>Давление на соперников.</li>
        <li>Возможность иппацу (+1 хан).</li>
      </ul>
      <p><strong>Минусы:</strong></p>
      <ul>
        <li>Нельзя менять руку.</li>
        <li>Соперники знают о вашем темпае.</li>
        <li>Риск наброса в догоняющее риичи.</li>
      </ul>` },
    { type: "theory", title: "Когда НЕ кидать риичи", html: `<p><strong>Даматэн</strong> — не объявлять риичи, оставаясь в темпае. Это часто выгоднее, чем кажется:</p>
      <ul>
        <li>Пинфу номи против дилера.</li>
        <li>Даматэн манган с хорошим ожиданием.</li>
        <li>Поздняя стадия, когда важнее не набросить.</li>
        <li>Если у вас уже есть яку — риичи не обязателен.</li>
      </ul>
      <div class="example"><strong>Совет:</strong> если ваша рука стоит 4+ хана, даматэн часто выгоднее.</div>` },
    { type: "quiz", title: "Когда НЕ стоит кидать риичи?", options: ["Опережающее пинфу","Пинфу номи против дилера","Дилерский пинфу дора","Быстрый рянмен номи"], correct: 1,
      explain: "Пинфу номи недилера проигрывает дилерскому риичи." },
    { type: "theory", title: "Даматэн манган", html: `<ul>
        <li>Ранний даматэн манган с хорошим ожиданием: лучше риичи, но оба варианта возможны.</li>
        <li>Ранний даматэн манган с ожиданием на центральные тайлы: лучше даматэн.</li>
        <li>Даматэн на 2600 с яку: по дефолту риичи.</li>
      </ul>
      <div class="example"><strong>Логика:</strong> риичи даёт +1 хан и ура-дору, но снижает процент побед.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сброс слабейшего дракона." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал." }
      ], intro: "Практика: решайте, кидать ли риичи." },
    { type: "quiz", title: "Что такое даматэн?", options: ["Не кидать риичи в темпае","Кидать риичи сразу","Отказаться от руки","Сбросить темпай"], correct: 0,
      explain: "Даматэн — оставаться в темпае без объявления риичи." }
  ] },

{ id: "lesson-15", title: "Относительная скорость", desc: "Сравнение своей руки с руками соперников", prereqs: ["lesson-14"],
  blocks: [
    { type: "theory", title: "Концепция", html: `<p>Ваша рука может быть быстрой, но если у соперников ещё быстрее — вы проиграете.</p>
      <p><strong>Относительная скорость</strong> — сравнение вашей скорости сбора с соперниками. Это важнее абсолютной скорости.</p>
      <div class="example"><strong>Пример (ASAPIN):</strong> у вас быстрая рука, но камича прокидывает пару 8-ок соу, тоймен и шимоча скинули по доре — они тоже стремятся к победе.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сбрасываем слабейший дракон. Но если соперники быстрее — возможно, стоит защищаться." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал." }
      ], intro: "Практика: оценивайте скорость соперников." },
    { type: "theory", title: "Как оценить скорость", html: `<ul>
        <li><strong>Дискарды:</strong> если соперник скидывает центральные тайлы — он близок к темпаю.</li>
        <li><strong>Открытия:</strong> быстрые открытия — признак быстрой руки.</li>
        <li><strong>Порядок сносов:</strong> если соперник скидывает форму — он либо фолдит, либо уже темпай.</li>
        <li><strong>Задержки:</strong> если соперник долго думает — возможно, он в сложной ситуации.</li>
      </ul>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сброс слабейшего дракона." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал." }
      ], intro: "Финальная практика." },
    { type: "quiz", title: "Что важнее: абсолютная или относительная скорость?", options: ["Абсолютная","Относительная","Обе равны","Зависит от раунда"], correct: 1,
      explain: "Важно не насколько быстра ваша рука, а насколько она быстрее рук соперников." }
  ] },

{ id: "lesson-16", title: "Защита в деталях", desc: "Судзи, кабе, бэтаори, две риичи", prereqs: ["lesson-15"],
  blocks: [
    { type: "theory", title: "Судзи и кабе", html: `<p><strong>Судзи</strong> — безопасные тайлы после риичи.</p>
      <p><strong>Кабе</strong> — ситуация, когда все 4 копии тайла видны. Соседние тайлы безопаснее.</p>
      <div class="example"><strong>Пример:</strong> если все 4 копии 5M видны, формы 4-6 и 5-5 физически невозможны.</div>` },
    { type: "practice", mode: "defense", tasks: [
        { hand: "5p 3p 4m 5m 6m 5z 5z 1z 1z 2z 3z 9s 1p", opponentDiscard: ["2p","8p","9m","1s"], riichiTile: "8p",
          safeDiscards: ["5p","9m","1s"], explain: "5P — двойное судзи. 9M и 1S — гэмбуцу." },
        { hand: "5s 5s 5s 5s 2s 3s 7s 8s 1m 2m 3m 4p 4p", opponentDiscard: ["2m","3p","7z"], riichiTile: "7z",
          safeDiscards: ["5s","2m","7z"], explain: "5S — кабе: все 4 копии у вас в руке." },
        { hand: "4m 1m 5m 6m 2p 3p 4p 5z 5z 1z 2z 3z 4z", opponentDiscard: ["7m","2z","9p"], riichiTile: "7m",
          safeDiscards: ["4m","2z","9p"], explain: "4M — судзи от 7M." }
      ], intro: "Практика: судзи, кабе, гэмбуцу." },
    { type: "theory", title: "Бэтаори, саки-гири, разрушение пар", html: `<ul>
        <li><strong>Бэтаори</strong> — полная защита. Сбрасывайте только безопасные тайлы.</li>
        <li><strong>Саки-гири</strong> — упреждающий сброс опасного тайла до объявления риичи.</li>
        <li><strong>Разрушение пар</strong> — сброс тайла из пары для уменьшения урона.</li>
      </ul>` },
    { type: "practice", mode: "defense", tasks: [
        { hand: "1m 2m 3m 4m 5m 6m 7p 8p 9p 2z 2z 5z 5z", opponentDiscard: ["1s","3z","7z","5m"], riichiTile: "5m",
          safeDiscards: ["5m","2m"], explain: "5M — гэмбуцу. 2M — судзи." },
        { hand: "1s 7s 2m 5m 8m 3p 6p 9p 5z 5z 1z 2z 3z", opponentDiscard: ["4s","9m","2p","6z"], riichiTile: "4s",
          safeDiscards: ["1s","7s","9m","6z"], explain: "1S и 7S — судзи от 4S." },
        { hand: "2p 8p 3p 7p 4s 7s 1s 2z 2z 5z 5z 6z 9m", opponentDiscard: ["5p","1z","9s"], riichiTile: "5p",
          safeDiscards: ["2p","8p","1z","9s"], explain: "2P и 8P — судзи." }
      ], intro: "Практика: бэтаори." },
    { type: "theory", title: "Игра против двух риичи", html: `<ul>
        <li><strong>Нотэн против двух риичи — строгий фолд.</strong></li>
        <li><strong>Темпай против двух риичи.</strong> Если рука стоит 2600+ и ожидание хорошее — можно рискнуть. На столе две риичи-палки = +2000 к победе.</li>
        <li><strong>В догоняющем риичи главное — количество аутов.</strong></li>
      </ul>` },
    { type: "quiz", title: "Что делать, если у вас нотэн против двух риичи?", options: ["Атаковать","Фолдить","Кинуть риичи","Сбросить дора"], correct: 1,
      explain: "Нотэн против двух риичи — строгий фолд." }
  ] },

{ id: "lesson-17", title: "Чтение дискардов", desc: "Вероятностное чтение и опасность тайлов", prereqs: ["lesson-16"],
  blocks: [
    { type: "theory", title: "Вероятностное чтение", html: `<p>Вы не можете предсказать руку соперника на 100%. Но можете наслаивать вероятности.</p>
      <p><strong>Признаки опасности:</strong></p>
      <ul>
        <li>Ранний снос акадоры или доры — знак, что у соперника есть яку.</li>
        <li>Странные сносы (напр. 4 из 244) — соперник либо фолдит, либо уже темпай.</li>
        <li>Сброс центральных тайлов — соперник близок к темпаю.</li>
      </ul>
      <div class="example"><strong>Правило (ASAPIN):</strong> думайте не об одиночных сносах, а об их комбинации.</div>` },
    { type: "practice", mode: "defense", tasks: [
        { hand: "2m 3m 4m 7p 8p 2s 3s 4s 5z 5z 1z 2z 9m", opponentDiscard: ["1p","9s","4z","2m","3z","1s","7p","8p"], riichiTile: "8p",
          safeDiscards: ["2m","7p","8p"], explain: "2M, 7P, 8P — гэмбуцу." },
        { hand: "1m 1m 5m 6m 7m 2p 3p 4p 2z 2z 5z 5z 9s", opponentDiscard: ["1s","3m","9p","3z","1m","2p"], riichiTile: "2p",
          safeDiscards: ["1m","2p","3m"], explain: "1M, 2P, 3M — гэмбуцу." },
        { hand: "1m 2m 3m 4m 5m 6m 7p 8p 9p 2z 2z 5z 5z", opponentDiscard: ["1s","3z","7z","5m"], riichiTile: "5m",
          safeDiscards: ["5m","2m"], explain: "5M — гэмбуцу. 2M — судзи." }
      ], intro: "Практика: читайте дискарды." },
    { type: "theory", title: "Опасность тайлов по формам", html: `<ul>
        <li><strong>Благородные:</strong> летят только в сянпон и танки. Относительно безопасны.</li>
        <li><strong>1 и 9:</strong> летят в пенчан, сянпон, рянмен. Умеренно безопасны.</li>
        <li><strong>2 и 8:</strong> плюс канчан. Умеренно опасны.</li>
        <li><strong>3, 4, 5, 6, 7:</strong> летят во все формы. Самые опасные.</li>
      </ul>
      <div class="example"><strong>Правило:</strong> если у вас выбор между 1M и 5M — кидайте 1M.</div>` },
    { type: "practice", mode: "defense", tasks: [
        { hand: "3m 9m 1p 4p 7p 2s 5s 8s 5z 5z 1z 2z 7z", opponentDiscard: ["6m","3p","1z","9s"], riichiTile: "6m",
          safeDiscards: ["3m","9m","1z","9s"], explain: "3M и 9M — судзи. 1E и 9S — гэмбуцу." },
        { hand: "1s 7s 2m 5m 8m 3p 6p 9p 5z 5z 1z 2z 3z", opponentDiscard: ["4s","9m","2p","6z"], riichiTile: "4s",
          safeDiscards: ["1s","7s","9m","6z"], explain: "1S и 7S — судзи." },
        { hand: "2p 8p 3p 7p 4s 7s 1s 2z 2z 5z 5z 6z 9m", opponentDiscard: ["5p","1z","9s"], riichiTile: "5p",
          safeDiscards: ["2p","8p","1z","9s"], explain: "2P и 8P — судзи." }
      ], intro: "Практика: применяйте правила опасности." },
    { type: "theory", title: "Комбинации сносов", html: `<p>Не думайте об одиночных сносах — думайте об их комбинации.</p>
      <div class="example"><strong>Пример (ASAPIN):</strong> если у вас 9M и 4P, и вы решите снести 9M, вам потом придётся снести 4P. Оценивайте риск всей комбинации.</div>` },
    { type: "quiz", title: "Какой тайл опаснее всего?", options: ["1m","5p","Wh","9s"], correct: 1,
      explain: "Центральные тайлы (4,5,6) летят во все формы ожиданий." }
  ] },

{ id: "lesson-18", title: "Игра по позиции", desc: "1-е, 2-е, 3-е, 4-е место, орасу", prereqs: ["lesson-17"],
  blocks: [
    { type: "theory", title: "Работа каждого места", html: `<ul>
        <li><strong>1-е место:</strong> сохранять лидерство. Не рисковать. Прокручивать ветра.</li>
        <li><strong>2-е место:</strong> соревноваться, если есть ради чего рисковать.</li>
        <li><strong>3-е место:</strong> бороться за выживание. Не фолдить без причины.</li>
        <li><strong>4-е место:</strong> рисковать. Другого выхода нет.</li>
      </ul>
      <div class="example"><strong>Правило:</strong> в восточном раунде все равны. В южном — места имеют значение.</div>` },
    { type: "theory", title: "Орасу", html: `<p><strong>Орасу</strong> — последняя раздача ханчана. Решения кардинально меняются:</p>
      <ul>
        <li>1-е место: помогайте другим, лишь бы не проиграть.</li>
        <li>4-е место: атакуйте. Без победы вы проиграли.</li>
        <li>2-е/3-е место: думайте о разнице в очках.</li>
      </ul>
      <div class="example"><strong>Совет:</strong> в орасу вы должны заранее предсказать, как будут играть соперники.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сброс 3W. Оцените, нужно ли вам атаковать." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал." }
      ], intro: "Практика: игра по позиции." },
    { type: "theory", title: "Работа 1-го места", html: `<ul>
        <li>Не кидайте догоняющее риичи в 3-м юге.</li>
        <li>Не объявляйте ненужных канов.</li>
        <li>Помогайте дилеру, если он не ваш конкурент.</li>
        <li>Не давайте дилеру собраться, если он ваш шимоча.</li>
      </ul>
      <div class="example"><strong>Правило (Фукути):</strong> первое место в южном раунде должно наблюдать за всем со стороны.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
        { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Сброс слабейшего дракона." },
        { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E." },
        { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал." }
      ], intro: "Финальная практика." },
    { type: "quiz", title: "Что делать 1-му месту в южном раунде?", options: ["Атаковать","Сохранять лидерство","Идти напролом","Кидать риичи всегда"], correct: 1,
      explain: "1-е место в южном раунде сохраняет лидерство." }
  ] },

{ id: "lesson-19", title: "Формальный темпай", desc: "Ценность и техники сбора (ASAPIN)", prereqs: ["lesson-18"],
  blocks: [
    { type: "theory", title: "Ценность формального темпая", html: `<p><strong>Формальный темпай</strong> — показать темпай в конце раздачи, даже если рука не собрана.</p>
      <p>Выплата за темпай (1000, 1500, 3000) может решить исход ханчана.</p>
      <div class="example"><strong>Правило (ASAPIN):</strong> 12-15 ход — зона формального темпая.</div>` },
    { type: "theory", title: "Пропорция стоимость/уке/круг", html: `<p>Стандарт ASAPIN:</p>
      <ul>
        <li>Обычная рука (1-шантэн, среднее уке) — начинать с 12-го хода.</li>
        <li>+1 дора — сдвиг на 1 круг.</li>
        <li>+2 доры — сдвиг на 2 круга.</li>
        <li>Хорошие формы — сдвиг на 1 круг.</li>
