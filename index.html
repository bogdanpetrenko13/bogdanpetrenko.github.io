<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Курс по риичи-маджонгу</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: linear-gradient(160deg, #1a3a2a 0%, #0d1e14 100%); color: #e8e8e8; min-height: 100vh; padding: 1rem 0.75rem; display: flex; justify-content: center; align-items: flex-start; }
.app { width: 100%; max-width: 980px; background: #1f2a25; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); padding: 1.5rem 1.2rem; border: 1px solid #2d3d35; }
@media (min-width: 720px) { .app { padding: 2rem 2.5rem; } }
.screen { display: none; } .screen.active { display: block; }
h1 { font-size: 1.6rem; font-weight: 700; color: #f5e6c8; text-align: center; margin-bottom: 0.4rem; }
@media (min-width: 720px) { h1 { font-size: 2rem; } }
.subtitle { text-align: center; color: #8aa898; margin-bottom: 1.5rem; font-size: 0.9rem; }
.header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.settings-btn { background: none; border: 1px solid #3d5448; color: #8aa898; font-size: 1.1rem; padding: 0.35rem 0.7rem; border-radius: 8px; cursor: pointer; font-family: inherit; }
.settings-btn:hover { border-color: #d4a373; color: #d4a373; }
.course-hero { display: block; width: 100%; background: linear-gradient(145deg, #1f3a4a 0%, #15232a 100%); border: 3px solid #8ec9e8; border-radius: 18px; padding: 1.5rem 1.4rem; cursor: pointer; transition: all 0.2s; text-align: left; color: #e8e8e8; font-family: inherit; margin-bottom: 1.2rem; }
.course-hero:hover { border-color: #b8dff0; transform: translateY(-2px); box-shadow: 0 12px 36px rgba(142, 201, 232, 0.15); }
.course-hero .icon { font-size: 2.4rem; margin-bottom: 0.4rem; }
.course-hero .title { font-size: 1.35rem; font-weight: 700; color: #8ec9e8; margin-bottom: 0.3rem; }
.course-hero .desc { font-size: 0.85rem; color: #8aa898; line-height: 1.5; margin-bottom: 0.8rem; }
.course-hero .progress-bar { height: 6px; background: #2d3d35; border-radius: 3px; overflow: hidden; }
.course-hero .progress-fill { height: 100%; background: linear-gradient(90deg, #8ec9e8, #6fa8c9); transition: width 0.3s; }
.course-hero .progress-text { font-size: 0.78rem; color: #8aa898; margin-top: 0.4rem; }
.glossary-hero { display: block; width: 100%; background: linear-gradient(145deg, #2a3a1f 0%, #1a2815 100%); border: 3px solid #c8e88e; border-radius: 18px; padding: 1.2rem 1.4rem; cursor: pointer; transition: all 0.2s; text-align: left; color: #e8e8e8; font-family: inherit; margin-bottom: 1.2rem; }
.glossary-hero:hover { border-color: #dff0b8; transform: translateY(-2px); box-shadow: 0 12px 36px rgba(200, 232, 142, 0.15); }
.glossary-hero .icon { font-size: 2rem; margin-bottom: 0.2rem; }
.glossary-hero .title { font-size: 1.15rem; font-weight: 700; color: #c8e88e; margin-bottom: 0.2rem; }
.glossary-hero .desc { font-size: 0.8rem; color: #8aa898; line-height: 1.4; }
.section-label { font-size: 0.85rem; color: #8aa898; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.6rem; margin-top: 0.4rem; }
.practice-grid { display: grid; grid-template-columns: 1fr; gap: 0.6rem; margin-bottom: 1.2rem; }
@media (min-width: 640px) { .practice-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .practice-grid { grid-template-columns: repeat(4, 1fr); } }
.practice-btn { background: linear-gradient(145deg, #253830 0%, #1a2820 100%); border: 2px solid #3d5448; border-radius: 12px; padding: 1rem 0.9rem; cursor: pointer; transition: all 0.2s; text-align: left; color: #e8e8e8; font-family: inherit; display: flex; align-items: center; gap: 0.7rem; }
.practice-btn:hover { border-color: #d4a373; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212, 163, 115, 0.12); }
.practice-btn .p-icon { font-size: 1.6rem; flex-shrink: 0; }
.practice-btn .p-title { font-size: 0.95rem; font-weight: 600; color: #f5e6c8; margin-bottom: 0.1rem; }
.practice-btn .p-desc { font-size: 0.72rem; color: #8aa898; line-height: 1.35; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; padding-bottom: 0.9rem; border-bottom: 1px solid #2d3d35; gap: 0.5rem; flex-wrap: wrap; }
#btn-back, #btn-lesson-back, #btn-courses-back, #btn-glossary-back { background: none; border: 1px solid #3d5448; color: #8aa898; font-size: 0.9rem; padding: 0.35rem 0.8rem; border-radius: 8px; cursor: pointer; font-family: inherit; }
#btn-back:hover, #btn-lesson-back:hover, #btn-courses-back:hover, #btn-glossary-back:hover { border-color: #d4a373; color: #d4a373; }
.progress { color: #8aa898; font-size: 0.85rem; }
.score { color: #d4a373; font-weight: 600; font-size: 0.9rem; }
.lesson-card { background: linear-gradient(145deg, #253830 0%, #1a2820 100%); border: 2px solid #3d5448; border-radius: 14px; padding: 1.1rem 1.2rem; margin-bottom: 0.75rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 1rem; }
.lesson-card:hover { border-color: #8ec9e8; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(142, 201, 232, 0.12); }
.lesson-card.completed { border-color: #5cb85c; }
.lesson-num { width: 42px; height: 42px; border-radius: 50%; background: #3d5448; color: #f5e6c8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.05rem; flex-shrink: 0; }
.lesson-card.completed .lesson-num { background: #2b7a2b; color: #e8f5e8; }
.lesson-info { flex: 1; min-width: 0; }
.lesson-title { font-size: 1rem; font-weight: 600; color: #f5e6c8; margin-bottom: 0.2rem; }
.lesson-desc { font-size: 0.78rem; color: #8aa898; line-height: 1.4; }
.lesson-progress-bar { height: 4px; background: #2d3d35; border-radius: 2px; margin-top: 0.5rem; overflow: hidden; }
.lesson-progress-fill { height: 100%; background: linear-gradient(90deg, #d4a373, #b88a5c); transition: width 0.3s; }
.lesson-card.completed .lesson-progress-fill { background: linear-gradient(90deg, #5cb85c, #2b7a2b); }
.lesson-arrow { color: #8aa898; font-size: 1.2rem; flex-shrink: 0; }
.lesson-header { background: linear-gradient(145deg, #1f3038 0%, #15232a 100%); border-left: 4px solid #8ec9e8; padding: 1rem 1.2rem; border-radius: 0 12px 12px 0; margin-bottom: 1.2rem; }
.lesson-header .l-title { font-size: 1.15rem; font-weight: 600; color: #8ec9e8; margin-bottom: 0.2rem; }
.lesson-header .l-desc { font-size: 0.82rem; color: #8aa898; }
.theory-block { background: #16211b; border-radius: 12px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; line-height: 1.65; font-size: 0.95rem; }
.theory-block h3 { color: #f5e6c8; font-size: 1.05rem; font-weight: 600; margin-bottom: 0.7rem; }
.theory-block p { margin-bottom: 0.7rem; }
.theory-block strong { color: #f5e6c8; }
.theory-block em { color: #d4a373; font-style: normal; font-weight: 600; }
.theory-block ul, .theory-block ol { margin-left: 1.3rem; margin-bottom: 0.7rem; }
.theory-block li { margin-bottom: 0.35rem; }
.theory-block .example { background: rgba(212, 163, 115, 0.08); border-left: 3px solid #d4a373; padding: 0.7rem 1rem; border-radius: 0 8px 8px 0; margin: 0.8rem 0; font-size: 0.9rem; }
.theory-block .example strong { color: #d4a373; }
.lesson-nav { display: flex; justify-content: space-between; gap: 0.6rem; margin-top: 1.5rem; flex-wrap: wrap; }
.lesson-nav .nav-right { display: flex; gap: 0.6rem; margin-left: auto; }
.lesson-progress-dots { display: flex; gap: 0.4rem; justify-content: center; margin: 1rem 0; }
.lesson-dot { width: 8px; height: 8px; border-radius: 50%; background: #2d3d35; transition: all 0.2s; }
.lesson-dot.active { background: #8ec9e8; transform: scale(1.3); }
.lesson-dot.done { background: #5cb85c; }
.lesson-complete-banner { background: linear-gradient(145deg, #2b4a2b, #1a3a1a); border: 2px solid #5cb85c; border-radius: 14px; padding: 1.5rem; text-align: center; margin-bottom: 1.2rem; }
.lesson-complete-banner .icon { font-size: 3rem; margin-bottom: 0.5rem; }
.lesson-complete-banner h3 { color: #7fd87f; font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
.lesson-complete-banner p { color: #b8d8b8; font-size: 0.9rem; line-height: 1.5; }
.hand { display: flex; flex-wrap: wrap; gap: 4px; margin: 0.8rem 0; padding: 1rem 0.6rem; background: #16211b; border-radius: 12px; min-height: 70px; align-items: center; justify-content: center; }
.tile { width: 40px; height: 54px; background: linear-gradient(170deg, #fdfdfa 0%, #e8e4d8 100%); border-radius: 5px; border: 1px solid #b8b0a0; box-shadow: 0 2px 0 #a89e8a, 0 3px 5px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; transition: all 0.12s; user-select: none; flex-shrink: 0; }
@media (min-width: 720px) { .tile { width: 46px; height: 62px; } .tile .num { font-size: 1.35rem; } .tile .honor { font-size: 1.3rem; } .tile .honor.honor-wide { font-size: 1rem; } }
.tile .num { font-size: 1.2rem; line-height: 1; }
.tile .suit { font-size: 0.6rem; line-height: 1; margin-top: 2px; opacity: 0.9; font-weight: 700; letter-spacing: 0.02em; }
.tile .honor { font-size: 1.1rem; line-height: 1; font-weight: 700; }
.tile .honor.honor-wide { font-size: 0.85rem; letter-spacing: -0.02em; }
.tile.m .num, .tile.m .suit { color: #b83a3a; }
.tile.p .num, .tile.p .suit { color: #2a6f8f; }
.tile.s .num, .tile.s .suit { color: #2b7a2b; }
.tile.z .honor { color: #333; }
.tile.z[data-code="5z"] .honor { color: #6a6a6a; }
.tile.z[data-code="6z"] .honor { color: #2b7a2b; }
.tile.z[data-code="7z"] .honor { color: #b83a3a; }
.tile.clickable:hover, .tile.clickable:active { transform: translateY(-3px); box-shadow: 0 5px 0 #a89e8a, 0 6px 10px rgba(0,0,0,0.4); }
.tile.selected { border-color: #d4a373; box-shadow: 0 0 0 2px #d4a373, 0 3px 0 #a89e8a; transform: translateY(-3px); }
.tile.correct { border-color: #5cb85c; box-shadow: 0 0 0 3px #5cb85c, 0 2px 0 #a89e8a; }
.tile.incorrect { border-color: #d9534f; box-shadow: 0 0 0 3px #d9534f, 0 2px 0 #a89e8a; }
.tile.disabled { cursor: default; opacity: 0.9; }
.tile.small { width: 30px; height: 40px; }
.tile.small .num { font-size: 0.9rem; }
.tile.small .honor { font-size: 0.9rem; }
.tile.small .honor.honor-wide { font-size: 0.7rem; }
.tile.small .suit { font-size: 0.5rem; margin-top: 0; }
.tile.drawn { box-shadow: 0 0 0 3px #8ec9e8, 0 3px 0 #a89e8a, 0 4px 10px rgba(142, 201, 232, 0.4); }
.question { font-size: 0.98rem; line-height: 1.55; color: #e8e8e8; margin-bottom: 1rem; }
.question strong { color: #f5e6c8; }
.palette-label { font-size: 0.8rem; color: #8aa898; margin-bottom: 0.4rem; margin-top: 0.6rem; }
.palette { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 0.8rem; padding: 0.6rem; background: #16211b; border-radius: 12px; justify-content: center; }
.palette .suit-group { display: flex; gap: 3px; margin-right: 6px; }
.palette .suit-group:last-child { margin-right: 0; }
.feedback { margin-top: 1rem; padding: 0.9rem 1rem; border-radius: 12px; line-height: 1.55; font-size: 0.88rem; }
.feedback.correct { background: rgba(92, 184, 92, 0.12); border-left: 4px solid #5cb85c; }
.feedback.incorrect { background: rgba(217, 83, 79, 0.12); border-left: 4px solid #d9534f; }
.feedback .headline { font-weight: 700; font-size: 0.98rem; margin-bottom: 0.4rem; }
.feedback.correct .headline { color: #7fd87f; }
.feedback.incorrect .headline { color: #e88884; }
.feedback .answer-block { margin: 0.5rem 0; padding: 0.5rem 0.7rem; background: rgba(0,0,0,0.25); border-radius: 8px; font-size: 0.85rem; }
.actions { margin-top: 1.2rem; display: flex; gap: 0.6rem; justify-content: flex-end; flex-wrap: wrap; }
button.primary { background: linear-gradient(145deg, #d4a373, #b88a5c); color: #1a1a1a; border: none; padding: 0.7rem 1.5rem; font-size: 0.95rem; font-weight: 600; border-radius: 10px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
button.primary:hover:not(:disabled) { filter: brightness(1.1); }
button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
button.secondary { background: transparent; color: #8aa898; border: 1px solid #3d5448; padding: 0.7rem 1.2rem; font-size: 0.95rem; border-radius: 10px; cursor: pointer; font-family: inherit; }
button.secondary:hover { border-color: #d4a373; color: #d4a373; }
button.danger { background: transparent; color: #e88884; border: 1px solid #6f3a3a; padding: 0.7rem 1.2rem; font-size: 0.95rem; border-radius: 10px; cursor: pointer; font-family: inherit; }
button.danger:hover { background: rgba(217, 83, 79, 0.1); }
.settings-section { background: #16211b; border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
.settings-section h3 { font-size: 0.95rem; color: #d4a373; margin-bottom: 0.8rem; }
.settings-section .desc { font-size: 0.82rem; color: #8aa898; line-height: 1.5; margin-bottom: 0.8rem; }
.settings-section .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
input[type="file"] { display: none; }
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #253830; border: 1px solid #d4a373; color: #f5e6c8; padding: 0.7rem 1.2rem; border-radius: 10px; font-size: 0.9rem; z-index: 9999; box-shadow: 0 8px 24px rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
.hint-row { font-size: 0.72rem; color: #6a7a72; margin-top: 0.4rem; text-align: right; }
.stats-mini { display: flex; justify-content: space-around; padding: 0.7rem; background: #16211b; border-radius: 10px; font-size: 0.8rem; color: #8aa898; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
.stats-mini span strong { color: #d4a373; }
.term-glossary { margin-top: 1.5rem; padding: 1rem 1.2rem; background: linear-gradient(145deg, #1f3038 0%, #15232a 100%); border-radius: 12px; border-left: 4px solid #8ec9e8; }
.term-glossary h4 { color: #8ec9e8; font-size: 0.95rem; margin-bottom: 0.7rem; }
.glossary-item-inline { font-size: 0.85rem; color: #b8c8d8; line-height: 1.55; padding: 0.4rem 0; border-bottom: 1px solid #2d3d35; }
.glossary-item-inline:last-child { border-bottom: none; }
.glossary-item-inline strong { color: #f5e6c8; margin-right: 0.3rem; }
.discard-row { display: flex; flex-wrap: wrap; gap: 2px; padding: 0.6rem 0.4rem; background: #0d1e14; border-radius: 8px; margin-bottom: 0.8rem; min-height: 44px; align-items: center; }
.draw-gap { width: 22px; height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #6a7a72; font-size: 0.85rem; font-weight: 600; opacity: 0.55; }
@media (min-width: 720px) { .draw-gap { width: 28px; height: 62px; font-size: 1rem; } }
.gloss-search-wrap { position: sticky; top: 0; z-index: 10; background: #1f2a25; padding: 0.8rem 0; margin-bottom: 0.6rem; }
.gloss-search-input { width: 100%; background: #16211b; border: 2px solid #3d5448; border-radius: 10px; padding: 0.7rem 1rem; font-size: 1rem; color: #e8e8e8; font-family: inherit; outline: none; }
.gloss-search-input:focus { border-color: #8ec9e8; }
.gloss-search-input::placeholder { color: #6a7a72; }
.gloss-info-row { font-size: 0.78rem; color: #8aa898; margin-top: 0.4rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
.gloss-clear-btn { background: none; border: 1px solid #3d5448; color: #8aa898; font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 6px; cursor: pointer; font-family: inherit; }
.gloss-clear-btn:hover { border-color: #d4a373; color: #d4a373; }
.gloss-categories { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.6rem 0 1rem; }
.gloss-cat-btn { background: #16211b; border: 1px solid #3d5448; color: #8aa898; font-size: 0.75rem; padding: 0.3rem 0.7rem; border-radius: 20px; cursor: pointer; font-family: inherit; }
.gloss-cat-btn:hover { border-color: #8ec9e8; color: #8ec9e8; }
.gloss-cat-btn.active { background: #8ec9e8; border-color: #8ec9e8; color: #1a3a2a; font-weight: 600; }
.gloss-full-list { display: flex; flex-direction: column; gap: 0.5rem; }
.gloss-full-item { background: #1f2a25; border: 1px solid #2d3d35; border-left: 3px solid #8ec9e8; border-radius: 10px; padding: 0.85rem 1rem; }
.gloss-full-item .term { font-size: 0.98rem; font-weight: 700; color: #f5e6c8; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.gloss-full-item .term .ja { font-size: 0.82rem; color: #8aa898; font-weight: 400; }
.gloss-full-item .definition { font-size: 0.86rem; color: #b8c8d8; line-height: 1.55; }
.gloss-no-results { text-align: center; padding: 2.5rem 1rem; color: #6a7a72; font-size: 0.95rem; }
.gloss-no-results .icon { font-size: 2.5rem; margin-bottom: 0.6rem; opacity: 0.5; }
mark { background: rgba(212, 163, 115, 0.35); color: #f5e6c8; padding: 0.05rem 0.2rem; border-radius: 3px; }
</style>
</head>
<body>
<div class="app">
  <div class="screen active" id="screen-home">
    <div class="header-row"><div style="width: 40px;"></div><h1 style="margin: 0;">Курс по риичи-маджонгу</h1><button class="settings-btn" id="btn-open-settings">⚙️</button></div>
    <p class="subtitle">От полного нуля до уверенного игрока · 24 урока</p>
    <button class="course-hero" id="btn-open-course">
      <div class="icon">📚</div><div class="title">Интерактивный курс</div>
      <div class="desc">24 урока в 6 модулях: фундамент, эффективность, ожидания, атака/защита, ситуационная игра, продвинутый уровень.</div>
      <div class="progress-bar"><div class="progress-fill" id="course-hero-progress" style="width:0%"></div></div>
      <div class="progress-text" id="course-hero-text">Пройдено уроков: 0 из 24</div>
    </button>
    <button class="glossary-hero" id="btn-open-glossary">
      <div class="icon">📖</div><div class="title">Глоссарий терминов</div>
      <div class="desc">100+ понятий с поиском и категориями.</div>
    </button>
    <div class="section-label">Свободная практика</div>
    <div class="practice-grid">
      <button class="practice-btn" data-practice="waits"><div class="p-icon">🎯</div><div><div class="p-title">Ожидания</div><div class="p-desc">Найдите все выигрышные тайлы</div></div></button>
      <button class="practice-btn" data-practice="efficiency"><div class="p-icon">📊</div><div><div class="p-title">Сброс</div><div class="p-desc">Развитие руки</div></div></button>
      <button class="practice-btn" data-practice="defense"><div class="p-icon">🛡️</div><div><div class="p-title">Защита</div><div class="p-desc">Гэмбуцу, судзи, кабе</div></div></button>
      <button class="practice-btn" data-practice="reading"><div class="p-icon">📖</div><div><div class="p-title">Чтение дискарда</div><div class="p-desc">Самый опасный тайл</div></div></button>
    </div>
    <div class="stats-mini" id="stats-mini"></div>
  </div>
  <div class="screen" id="screen-courses">
    <div class="header-row"><button id="btn-courses-back">← Меню</button><h1 style="margin: 0; font-size: 1.3rem;">📚 Курс</h1><div style="width: 60px;"></div></div>
    <p class="subtitle" id="courses-summary"></p><div id="courses-list"></div>
  </div>
  <div class="screen" id="screen-glossary">
    <div class="header-row"><button id="btn-glossary-back">← Меню</button><h1 style="margin: 0; font-size: 1.3rem;">📖 Глоссарий</h1><div style="width: 60px;"></div></div>
    <div class="gloss-search-wrap">
      <input type="text" class="gloss-search-input" id="glossSearchInput" placeholder="🔍 Поиск..." autocomplete="off">
      <div class="gloss-info-row"><span id="glossSearchInfo">Введите запрос</span><button class="gloss-clear-btn" id="glossClearBtn" style="display:none;">✕ Очистить</button></div>
    </div>
    <div class="gloss-categories" id="glossCategories"></div><div id="glossContent"></div>

const TERMS = {};
for (const g of GLOSSARY) { if (!TERMS[g.term.toLowerCase()]) TERMS[g.term.toLowerCase()] = g.def; }

function renderGlossary(container, text) {
  const lower = text.toLowerCase(); const found = [];
  for (const [key, val] of Object.entries(TERMS)) {
    try { const re = new RegExp('(?<![а-яё])' + escapeRegex(key) + '(?![а-яё])', 'i'); if (re.test(lower)) found.push([key, val]); }
    catch (e) { const idx = lower.indexOf(key); if (idx !== -1) { const b = idx === 0 ? ' ' : lower[idx-1]; const a = idx+key.length >= lower.length ? ' ' : lower[idx+key.length]; if (!/[а-яё]/.test(b) && !/[а-яё]/.test(a)) found.push([key, val]); } }
  }
  if (found.length === 0) return;
  found.sort((a, b) => b[0].length - a[0].length);
  const div = document.createElement('div'); div.className = 'term-glossary';
  div.innerHTML = '<h4>📖 Термины в этом уроке</h4>' + found.map(([k,v]) => `<div class="glossary-item-inline"><strong>${escapeHtml(k)}</strong> — ${escapeHtml(v)}</div>`).join('');
  container.appendChild(div);
}

    { type: "theory", title: "5 основ сбора (Nemata)", html: `<ol><li>Уке приоритетнее хэнка.</li><li>Уке приоритетнее защиты.</li><li>Самое важное уке — уке вблизи победы.</li><li>Уке, увеличивающее стоимость, приоритетнее уке, увеличивающего ауты.</li><li>Ожидание лучше рянмена и стоимость выше мангана не стоят потерь в скорости.</li></ol>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "<strong>1E</strong> — одиночный ветер без пары. Это чистый <em>хэнка</em>: он не уменьшает шантэн. <strong>5M</strong> — центральный опорный тайл: к нему подойдут 3M, 4M, 6M, 7M. Любой из них даст <em>уке</em> через рянмен. 1E никогда не даст уке. Сброс 1E." },
      { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Пять блоков уже есть. <strong>3W (Западный)</strong> и <strong>5Wh (Белый дракон)</strong> — оба одиночные, оба <em>хэнка</em>. Но качество разное: пон 3W не даёт яку, а пон 5Wh даёт +1 хан <em>якухая</em>. Выбираем слабейший хэнка. Сброс 3W." },
      { hand: "234m 567m 78p 24s 88s 5z 3z", best: ["3z"], explain: "<strong>24S</strong> — канчан, даёт <em>уке</em> на 3S. <strong>3W</strong> и <strong>5Wh</strong> — лишние одиночные (<em>хэнка</em>). Сравниваем качество: 3W (ветер без пары) слабее 5Wh (дракон, пон даёт якухай). Сброс 3W." }
    ], intro: "В каждом объяснении явно указано, какой тайл — уке, а какой — хэнка." }
  ] },
{ id: "lesson-04", title: "Введение в защиту", desc: "Гэмбуцу и судзи", prereqs: ["lesson-03"],
  blocks: [
    { type: "theory", title: "Зачем защищаться", html: `<p>3 из 4 раздач мы не выигрываем. Главная задача — <strong>не набросить</strong>.</p>` },
    { type: "theory", title: "Гэмбуцу", html: `<p><strong>Фуритен</strong> — запрет на рон, если тайл в ваших сбросах.</p><p><strong>Гэмбуцу</strong> — тайл из дискарда противника. <em>100% безопасен</em>.</p>` },
    { type: "theory", title: "Судзи", html: `<p>Если противник сбросил X, то X−3 и X+3 менее опасны.</p><ul><li>4 → 1 и 7.</li><li>5 → 2 и 8.</li><li>6 → 3 и 9.</li></ul>` },
    { type: "practice", mode: "defense", tasks: [
      { hand: "2m 3m 4m 7p 8p 2s 3s 4s 5z 5z 1z 2z 9m", opponentDiscard: ["1p","9s","4z","2m","3z","1s","7p","8p"], riichiTile: "8p", safeDiscards: [], explain: "<strong>2M, 7P, 8P</strong> — гэмбуцу: противник сам сбрасывал эти тайлы. 100% безопасны." },
      { hand: "1m 1m 5m 6m 7m 2p 3p 4p 2z 2z 5z 5z 9s", opponentDiscard: ["1s","3m","9p","3z","1m","2p"], riichiTile: "2p", safeDiscards: [], explain: "<strong>1M, 2P, 3M</strong> — гэмбуцу. Дополнительно: <strong>6M</strong> — судзи от сброшенной 3M." },
      { hand: "1m 2m 3m 4m 5m 6m 7p 8p 9p 2z 2z 5z 5z", opponentDiscard: ["1s","3z","7z","5m"], riichiTile: "5m", safeDiscards: [], explain: "<strong>5M</strong> — гэмбуцу. <strong>2M</strong> — судзи от сброшенной 5M." },
      { hand: "1s 7s 2m 5m 8m 3p 6p 9p 5z 5z 1z 2z 3z", opponentDiscard: ["4s","9m","2p","6z"], riichiTile: "4s", safeDiscards: [], explain: "<strong>1S, 7S</strong> — судзи от сброшенной 4S. <strong>9M, 6G</strong> — гэмбуцу." },
      { hand: "2p 8p 3p 7p 4s 7s 1s 2z 2z 5z 5z 6z 9m", opponentDiscard: ["5p","1z","9s"], riichiTile: "5p", safeDiscards: [], explain: "<strong>2P, 8P</strong> — судзи от сброшенной 5P. <strong>1E, 9S</strong> — гэмбуцу." },
      { hand: "3m 9m 1p 4p 7p 2s 5s 8s 5z 5z 1z 2z 7z", opponentDiscard: ["6m","3p","1z","9s"], riichiTile: "6m", safeDiscards: [], explain: "<strong>3M, 9M</strong> — судзи от сброшенной 6M. <strong>1E, 9S</strong> — гэмбуцу." }
    ], intro: "Сначала ищите гэмбуцу (тайлы из дискарда противника), затем добавляйте судзи." }
  ] },
{ id: "lesson-05", title: "Формы и их сила", desc: "Рянмен, канчан, пенчан", prereqs: ["lesson-04"],
  blocks: [
    { type: "theory", title: "Рянмен — золотой стандарт", html: `<p><strong>Рянмен</strong> — двустороннее (3-4M ждёт 2M или 5M). <strong>8 тайлов</strong>. Лучшая форма.</p>` },
    { type: "theory", title: "Канчан и пенчан", html: `<p><strong>Канчан</strong> — в середину (2-4M ждёт 3M). <strong>4 тайла</strong>.</p><p><strong>Пенчан</strong> — краевое (1-2M ждёт 3M). <strong>4 тайла</strong>.</p><div class="example">Канчан лучше пенчана — улучшается пятёркой.</div>` },
    { type: "theory", title: "Рянкан — ловушка", html: `<p><strong>Рянкан</strong> — 3 тайла через один (2-4-6M). Занимает 3 тайла, не завершается сразу.</p>` },
    { type: "practice", mode: "waits", tasks: [
      { hand: "123m 456m 789m 11p 78s", waits: ["6s","9s"], explain: "Три сета и пара 1P-1P. <strong>Рянмен 7-8S</strong> — двустороннее ожидание. Ждёт 6S или 9S. 8 тайлов. Самая сильная форма." },
      { hand: "123m 456m 789m 24p 55s", waits: ["3p"], explain: "Три сета и пара 5S-5S. <strong>Канчан 2-4P</strong> — внутреннее ожидание. Ждёт только 3P. 4 тайла. Улучшается пятёркой до рянмена 3-4 или 4-5." },
      { hand: "123m 456m 789m 12p 55s", waits: ["3p"], explain: "Три сета и пара 5S-5S. <strong>Пенчан 1-2P</strong> — краевое ожидание. Ждёт только 3P. 4 тайла. Улучшить до рянмена нельзя (0P не существует)." }
    ], intro: "Определите форму и её ожидание. Каждая задача показывает один из типов: рянмен, канчан, пенчан." }
  ] },
{ id: "lesson-06", title: "Теория 5 блоков", desc: "Основа сбора", prereqs: ["lesson-05"],
  blocks: [
    { type: "theory", title: "Что такое блок", html: `<ul><li>Готовый сет — 3-4-5M.</li><li>Пара — Wh-Wh.</li><li>Рянмен — 3-4M.</li><li>Канчан — 2-4M.</li><li>Пенчан — 1-2M.</li><li>Опорный тайл — одиночная 5P.</li></ul>` },
    { type: "theory", title: "Всегда 5 блоков", html: `<p>4 сета + пара = <strong>ровно 5 блоков</strong>.</p><ul><li>5 — идеально.</li><li>6+ — режьте слабейший.</li><li>4 — создавайте новые.</li></ul>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "234m 567m 78p 12s 22z 5z", best: ["5z"], explain: "У вас 6 блоков: 234M, 567M, 78P, 12S, 22Z, 5Wh. Для победы нужно <strong>ровно 5</strong>. <strong>5Wh</strong> — лишний одиночный дракон без пары. Сброс 5Wh." },
      { hand: "123m 456m 789m 12p 78s 9s", best: ["9s"], explain: "У вас 6 блоков: 123M, 456M, 789M, 12P, 78S, 9S. <strong>9S</strong> — одиночный терминал, не участвует в форме 7-8S. Сброс 9S оставляет 5 блоков." },
      { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "Блоки: 234M, 567M, 78P, 34S, 55S, 6G. <strong>1M</strong> — изолированный терминал, седьмой блок. Сброс 1M." }
    ], intro: "Посчитайте блоки. Их должно быть ровно 5. Найдите лишний." }
  ] },
{ id: "lesson-07", title: "Классификация ишантэнов", desc: "3 типа", prereqs: ["lesson-06"],
  blocks: [
    { type: "theory", title: "Три типа", html: `<ol><li><strong>С двумя сетами и парой</strong> — самый частый.</li><li><strong>Хэддоресу</strong> — без пары.</li><li><strong>Куццуки</strong> — 3 сета + пара + 2 плавающих тайла.</li></ol><div class="example">Сила: куццуки > хэддоресу > с двумя сетами и парой.</div>` },
    { type: "theory", title: "С двумя сетами и парой", html: `<p>Самый частый. Выбор: пронести тацу / зафиксировать тацу / снести плавающий тайл.</p>` },
    { type: "theory", title: "Хэддоресу и куццуки", html: `<p><strong>Хэддоресу</strong> — без пары, ценны формы, легко дающие пару.</p><p><strong>Куццуки</strong> — лучший ишантэн.</p>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Тип руки: <strong>с двумя сетами и парой</strong>. Готовы 234M, 567M, пара 22Z, есть 78P и 12S. Лишние 3W и 5Wh. Сброс 3W (слабейший)." },
      { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "Тип руки: <strong>с двумя сетами и парой</strong>. 234M, 567M, пара 55S, формы 78P и 34S. 1M — лишний терминал. Сброс 1M." },
      { hand: "123m 456m 78m 234p 5z 5z 1z", best: ["1z"], explain: "Тип руки: <strong>куццуки</strong>. Готовы 3 сета (123M, 456M, 234P) и пара 5Z-5Z. 78M — плавающая форма. 1E — лишний ветер. Сброс 1E." }
    ], intro: "Определите тип ишантэна: с двумя сетами и парой / хэддоресу / куццуки. Затем выберите сброс." }
  ] },
{ id: "lesson-08", title: "Выбор ожидания", desc: "Стоимость vs процент", prereqs: ["lesson-07"],
  blocks: [
    { type: "theory", title: "Сянпон выгоднее канчана", html: `<p>При равных аутах <strong>сянпон</strong> имеет больший процент побед, чем канчан.</p><p>Исключения: дыра на 2 без залома лучше сянпона на 3-7; дыра на 3 лучше сянпона на 4-5-6.</p>` },
    { type: "theory", title: "Сянпон vs другие", html: `<ul><li><strong>Рянмен</strong> — лучший. Два вида, максимум аутов.</li><li><strong>Сянпон</strong> — средний, сопоставим с рянменом.</li><li><strong>Канчан</strong> — слабее.</li><li><strong>Пенчан</strong> — слабее.</li></ul><div class="example">Между сянпоном и канчаном при равных аутах — сянпон.</div>` },
    { type: "theory", title: "Стоимость vs процент", html: `<ul><li>Для закрытой руки от 3-30: при небольшой разнице — хорошее ожидание.</li><li>Если плохое ожидание даёт +1 хан и 10 фу — дорогой вариант.</li></ul>` },
    { type: "practice", mode: "waits", tasks: [
      { hand: "234m 567m 78p 234s 55z", waits: ["6p","9p"], explain: "Рянмен 7-8P ждёт 6P или 9P. 8 тайлов. Самое сильное ожидание." },
      { hand: "123m 456m 789m 24p 55s", waits: ["3p"], explain: "Канчан 2-4P ждёт только 3P. 4 тайла. Слабее рянмена." },
      { hand: "123m 456m 789m 22p 55s", waits: ["2p","5s"], explain: "Сянпон: две пары 22P и 55S. Ждёт 2P или 5S. 4 тайла, но с учётом двух пар — процент побед сопоставим с рянменом." }
    ], intro: "Сравните типы ожиданий: рянмен, канчан, сянпон. Вспомните: сянпон выгоднее канчана при равных аутах." }
  ] },
{ id: "lesson-09", title: "Базовые ожидания", desc: "Танки, канчан, пенчан, рянмен", prereqs: ["lesson-08"],
  blocks: [
    { type: "theory", title: "Четыре базовых", html: `<ul><li><strong>Танки</strong> — 3 тайла.</li><li><strong>Канчан</strong> — 4 тайла.</li><li><strong>Пенчан</strong> — 4 тайла.</li><li><strong>Рянмен</strong> — 8 тайлов.</li></ul>` },
    { type: "practice", mode: "waits", tasks: [
      { hand: "123m 456m 789m 22p 1s", waits: ["1s"], explain: "Три сета, пара 22P. <strong>Танки</strong> на 1S. 3 тайла. Ожидание в пару." },
      { hand: "123m 456m 789m 13p 55s", waits: ["2p"], explain: "Три сета, пара 55S. <strong>Канчан</strong> 1-3P ждёт 2P. 4 тайла. Внутреннее ожидание." },
      { hand: "123m 456m 789m 12p 55s", waits: ["3p"], explain: "Три сета, пара 55S. <strong>Пенчан</strong> 1-2P ждёт 3P. 4 тайла. Краевое ожидание." }
    ], intro: "Определите тип ожидания: танки, канчан или пенчан." }
  ] },
{ id: "lesson-10", title: "Множественные ожидания", desc: "Санмэнчан, нобетан", prereqs: ["lesson-09"],
  blocks: [
    { type: "theory", title: "Санмэнчан", html: `<p><strong>Санмэнчан</strong> — 5 подряд (2-3-4-5-6M). Разложение:</p><ul><li>2-3 + 4-5-6 → 1M/4M.</li><li>2-3-4 + 5-6 → 4M/7M.</li><li>2-3-4-5 + 6 → 6M (танки).</li></ul><p>Итого 1M, 4M, 7M — до 12 тайлов.</p>` },
    { type: "theory", title: "Нобетан", html: `<p>4 подряд (2-3-4-5M). Ждёт 2M или 5M — 6 тайлов.</p>` },
    { type: "practice", mode: "waits", tasks: [
      { hand: "23456m 234p 567p 88s", waits: ["1m","4m","7m"], explain: "<strong>Санмэнчан 2-3-4-5-6M</strong>. Разложение: 2-3 + 4-5-6 → 1M/4M; 2-3-4 + 5-6 → 4M/7M; 2-3-4-5 + 6 → 6M (танки). Итого 1M, 4M, 7M — до 12 тайлов." },
      { hand: "123m 456m 789m 2345p 5z", waits: ["2p","5p","5z"], explain: "<strong>Нобетан 2-3-4-5P</strong> принимает 2P или 5P. Плюс танки на 5Z. Итого 2P, 5P, 5Z." },
      { hand: "111m 234m 567m 99p 22s", waits: ["9p","2s"], explain: "Три сета и две пары 99P и 22S. <strong>Сянпон</strong>: 9P или 2S. Плюс 1M — закрытый пон, но он не участвует в ожидании." }
    ], intro: "Найдите все выигрышные тайлы. Обращайте внимание на длинные формы (5+ подряд)." }
  ] },
{ id: "lesson-11", title: "Яку и стратегия", desc: "Таняо, пинфу, якухай", prereqs: ["lesson-10"],
  blocks: [
    { type: "theory", title: "Основные яку", html: `<ul><li><strong>Таняо</strong> — тайлы 2–8. +1 хан. Открытая и закрытая.</li><li><strong>Пинфу</strong> — все сеты последовательности, пара не дракон/ветер. +1 хан. ТОЛЬКО закрытая.</li><li><strong>Якухай</strong> — ПОН драконов или ветра раунда. +1 хан. Пара НЕ даёт якухай.</li><li><strong>Иппэйко</strong> — 2 одинаковые последовательности. +1 хан. ТОЛЬКО закрытая.</li></ul>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Целимся в <strong>пинфу</strong>: все сеты последовательности, пара 22Z (не дракон, не ветер раунда). 3W и 5Wh не дают новых форм. Сброс 3W." },
      { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E. Целимся в <strong>пинфу</strong> или <strong>таняо</strong> (если уберём 1M). 1E — одиночный ветер, не встраивается в пинфу. Сброс 1E." },
      { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал. Целимся в <strong>пинфу</strong> (все сеты последовательности, пара 55S) или <strong>таняо</strong>. 6G — дракон, может стать якухаем. Сброс 1M." }
    ], intro: "Выбирайте сброс, помня о цели: какое яку вы собираете — пинфу, таняо или якухай." }
  ] },
{ id: "lesson-12", title: "Дора и акадора", desc: "Как встраивать", prereqs: ["lesson-11"],
  blocks: [
    { type: "theory", title: "Дора", html: `<p><strong>Дора</strong> — бонусный тайл. +1 хан. Не яку.</p><p><strong>Ура-дора</strong> — после риичи.</p>` },
    { type: "theory", title: "Акадора", html: `<p><strong>Акадора</strong> — красная 5. +1 хан. Трудна для встраивания.</p>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "234m 567m 78p 12s 22z 3z 5z", best: ["3z"], explain: "Дор в руке нет. Целимся в скорость: сбрасываем слабейший одиночный тайл (3W). 5Wh может стать якухаем — оставляем." },
      { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M — центральный тайл (может стать дорой при индикаторе 4M/6M). 1E — одиночный ветер, доры не даёт. Сброс 1E." },
      { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал. В игре с акадорами только 5 может быть красной. 1M доры не даёт. Сброс 1M." }
    ], intro: "Помните: дора — не яку. Оценивайте, встраивается ли дора в форму." }
  ] },
{ id: "lesson-13", title: "Отступить или надавить", desc: "4 параметра (Фукути)", prereqs: ["lesson-12"],
  blocks: [
    { type: "theory", title: "4 параметра", html: `<ol><li><strong>Стоимость руки.</strong></li><li><strong>Качество ожидания.</strong> Рянмен и лучше — атакуем.</li><li><strong>Близость к темпаю.</strong> Темпай — атакуем.</li><li><strong>Место в ханчане.</strong> 1-е — осторожнее; 4-е — агрессивнее.</li></ol>` },
    { type: "theory", title: "Правила 1-4", html: `<ol><li>Пинфу номи — даматэн — пережиток.</li><li>Догоняющее с пинфу — только до 9-го хода.</li><li>Не кидаем риичи пинфу против дилерского риичи.</li><li>Пинфу дора — всегда риичи.</li></ol>` },
    { type: "theory", title: "Правила 5-11", html: `<ol start="5"><li>Быстрая номи с рянменом — железное риичи.</li><li>Медленная номи с рянменом — риичи.</li><li>Догоняющее риичи в рянмен — сложно.</li><li>Номи с канчаном — риичи нельзя.</li><li>Дилерское риичи с канчаном — как нравится.</li><li>Риичи с перспективным канчаном — как нравится.</li><li>Дилерское риичи с перспективным канчаном — риичи.</li></ol>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "123m 456m 789m 11p 34s 6z", best: ["6z"], explain: "<strong>Параметр «стоимость руки»</strong>: рука дешёвая (нет дор, только базовые яку). <strong>Параметр «близость к темпаю»</strong>: 1-шантэн. Сбрасываем одиночный 6G — он не участвует в структуре (4 сета + пара уже почти готовы)." },
      { hand: "234m 567m 567p 34s 88s 2z", best: ["2z"], explain: "<strong>Параметр «качество ожидания»</strong>: рянмен 3-4S ждёт 2S или 5S (8 тайлов) — сильное. Пять блоков уже есть. 2S (Южный) — чужой ветер, сброс." },
      { hand: "234m 567m 567p 234s 5z 6z", best: ["6z"], explain: "<strong>Параметр «стоимость руки»</strong>: 4 сета + 2 одиночных. Нужна пара. 5Wh может дать якухай при поне. 6G — просто изолированный. Сброс 6G." }
    ], intro: "Каждая задача иллюстрирует один из 4 параметров Фукути." }
  ] },
{ id: "lesson-14", title: "Риичи: когда кидать", desc: "Даматэн и правила", prereqs: ["lesson-13"],
  blocks: [
    { type: "theory", title: "Плюсы и минусы", html: `<p><strong>Плюсы:</strong> +1 хан, ура-доры, давление, иппацу.</p><p><strong>Минусы:</strong> нельзя менять руку, соперники знают.</p>` },
    { type: "theory", title: "Когда НЕ кидать", html: `<ul><li>Пинфу номи против дилера.</li><li>Даматэн манган с хорошим ожиданием.</li><li>Поздняя стадия.</li><li>Уже есть яку.</li></ul>` },
    { type: "practice", mode: "waits", tasks: [
      { hand: "123m 456m 789m 22p 34s", waits: ["2s","5s"], explain: "Три сета, пара 22P и <strong>рянмен 3-4S</strong>. Сильное ожидание — с таким кидаем риичи. Риичи даст +1 хан и ура-доры при том, что процент побед высокий." },
      { hand: "123m 456m 789m 24p 55s", waits: ["3p"], explain: "Три сета, пара 55S и <strong>канчан 2-4P</strong>. Слабое ожидание. Часто выбирают <em>даматэн</em>, особенно против дилера. Даматэн даёт больший процент побед." },
      { hand: "123m 456m 789m 12p 55s", waits: ["3p"], explain: "Три сета, пара 55S и <strong>пенчан 1-2P</strong>. Самое слабое ожидание. Почти всегда даматэн — риичи не окупает риск при таком вейте." }
    ], intro: "Определите тип ожидания. От него зависит решение о риичи." }
  ] },
{ id: "lesson-15", title: "Относительная скорость", desc: "Сравнение с соперниками", prereqs: ["lesson-14"],
  blocks: [
    { type: "theory", title: "Концепция", html: `<p>Ваша рука может быть быстрой, но если соперники ещё быстрее — вы проиграете. <strong>Относительная скорость</strong> важнее абсолютной.</p>` },
    { type: "theory", title: "Как оценить", html: `<ul><li><strong>Дискарды</strong> — центральные тайлы = близко к темпаю.</li><li><strong>Открытия</strong> — быстрые = быстрая рука.</li><li><strong>Порядок сносов</strong> — снос формы = фолд или темпай.</li><li><strong>Задержки</strong> — соперник думает.</li></ul>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "234m 567m 78p 34s 22z 3z 5z", best: ["3z"], explain: "У вас 5 блоков, рука близка к темпаю — <strong>относительная скорость высокая</strong>. Можно играть эффективно. Сбрасываем слабейший одиночный (3W, чужой ветер)." },
      { hand: "123m 456m 789m 12p 34s 5z", best: ["5z"], explain: "4 сета + пара + 2 рянмена. Относительная скорость — максимальная. Одиночный 5Wh — сброс, он не нужен при такой сильной структуре." },
      { hand: "123m 456m 234p 567p 9s 5z", best: ["9s"], explain: "4 сета + пара + 2 одиночных. Нужна пара для 5-го блока. 9S — терминал, его ценность ниже, чем у 5Wh (потенциальный якухай). Сброс 9S." }
    ], intro: "Оцените относительную скорость: чем ближе ваша рука к темпаю, тем выгоднее атаковать." }
  ] },
{ id: "lesson-16", title: "Защита в деталях", desc: "Судзи, кабе, бэтаори", prereqs: ["lesson-15"],
  blocks: [
    { type: "theory", title: "Судзи и кабе", html: `<p><strong>Судзи</strong> — безопасные тайлы после риичи. <strong>Кабе</strong> — все 4 копии видны.</p>` },
    { type: "theory", title: "Бэтаори, саки-гири", html: `<ul><li><strong>Бэтаори</strong> — полная защита.</li><li><strong>Саки-гири</strong> — упреждающий сброс.</li><li><strong>Разрушение пар</strong>.</li></ul>` },
    { type: "theory", title: "Против двух риичи", html: `<ul><li>Нотэн — строгий фолд.</li><li>Темпай: 2600+ и хорошее ожидание — можно рискнуть.</li></ul>` },
    { type: "practice", mode: "defense", tasks: [
      { hand: "2m 3m 4m 7p 8p 2s 3s 4s 5z 5z 1z 2z 9m", opponentDiscard: ["2p","2p","2p","2p","1s","9m","4z","3z"], riichiTile: "3z", safeDiscards: [], explain: "Все 4 копии 2P видны — это <strong>кабэ</strong>. Противник не может иметь форму 1-3 или 4-6 через 2P. Соседние с 2P тайлы становятся безопаснее. Гэмбуцу: 1S, 9M, 4Z. Плюс тайлы за кабэ от 2P." },
      { hand: "1m 1m 5m 6m 7m 2p 3p 4p 2z 2z 5z 5z 9s", opponentDiscard: ["1s","3m","9p","3z","1m","2p"], riichiTile: "2p", safeDiscards: [], explain: "Гэмбуцу: 1M, 2P, 3M (все три в дискарде). <strong>Судзи</strong> от 3M: 6M. Судзи от 2P: 5P. Тайлы <em>за кабэ</em>: 5M (у вас тройка 5-6-7M, но у противника 5M не полный — оставшиеся копии судзи)." },
      { hand: "1s 7s 2m 5m 8m 3p 6p 9p 5z 5z 1z 2z 3z", opponentDiscard: ["4s","9m","2p","6z","4s"], riichiTile: "4s", safeDiscards: [], explain: "Противник сбросил две 4S — это признак работы <strong>кабэ</strong> по 4S. Гэмбуцу: 9M, 2P, 6G. Судзи от 4S: 1S и 7S." }
    ], intro: "Гэмбуцу — 100%. Судзи — высокая вероятность. Кабэ — форма работает в вашу пользу." }
  ] },
{ id: "lesson-17", title: "Чтение дискардов", desc: "Вероятностное чтение", prereqs: ["lesson-16"],
  blocks: [
    { type: "theory", title: "Вероятностное чтение", html: `<ul><li>Ранний снос акадоры/доры — есть яку.</li><li>Странные сносы — фолд или темпай.</li><li>Сброс центральных — близко к темпаю.</li></ul>` },
    { type: "theory", title: "Опасность по формам", html: `<ul><li><strong>Благородные</strong> — сянпон и танки.</li><li><strong>1, 9</strong> — пенчан, сянпон, рянмен.</li><li><strong>2, 8</strong> — плюс канчан.</li><li><strong>3–7</strong> — все формы. Самые опасные.</li></ul>` },
    { type: "theory", title: "Комбинации сносов", html: `<p>Оценивайте риск комбинации, а не каждого сноса по отдельности.</p>` },
    { type: "practice", mode: "defense", tasks: [
      { hand: "2m 3m 4m 7p 8p 2s 3s 4s 5z 5z 1z 2z 9m", opponentDiscard: ["1p","9s","4z","2m","3z","1s","7p","8p"], riichiTile: "8p", safeDiscards: [], explain: "Дискард противника содержит 4 разных ветра и 2 терминала — это признак либо <strong>читоицу</strong>, либо дальнего ишантэна. Гэмбуцу: 2M, 7P, 8P. Судзи от 8P: 5P. Судзи от 2M: 5M (осторожно, 5M может быть в руке)." },
      { hand: "1m 1m 5m 6m 7m 2p 3p 4p 2z 2z 5z 5z 9s", opponentDiscard: ["1s","3m","9p","3z","1m","2p"], riichiTile: "2p", safeDiscards: [], explain: "Дискард противника <strong>плотный</strong> — есть центральные тайлы (3M, 2P). Это не читоицу, а скорее плоская рука. Гэмбуцу: 1M, 2P, 3M. Судзи от 3M: 6M. Судзи от 2P: 5P." },
      { hand: "3m 9m 1p 4p 7p 2s 5s 8s 5z 5z 1z 2z 7z", opponentDiscard: ["6m","3p","1z","9s","6m"], riichiTile: "6m", safeDiscards: [], explain: "Противник дважды сбросил 6M — значит, у него не может быть формы 4-5-6M. Но судзи от 6M остаются: 3M и 9M. Гэмбуцу: 3P, 1E, 9S. Судзи от 3P: 6P." }
    ], intro: "Читайте паттерны дискарда: плотные / скудные / с повторами." }
  ] },
{ id: "lesson-18", title: "Игра по позиции", desc: "1-е, 4-е место, орасу", prereqs: ["lesson-17"],
  blocks: [
    { type: "theory", title: "Работа каждого места", html: `<ul><li><strong>1-е</strong> — сохранять лидерство, не рисковать.</li><li><strong>2-е</strong> — соревноваться.</li><li><strong>3-е</strong> — выживать.</li><li><strong>4-е</strong> — рисковать.</li></ul>` },
    { type: "theory", title: "Орасу", html: `<ul><li>1-е: помогайте другим.</li><li>4-е: атакуйте.</li><li>2-3: думайте о разнице в очках.</li></ul>` },
    { type: "theory", title: "Работа 1-го места", html: `<ul><li>Не кидайте догоняющее риичи в 3-м юге.</li><li>Не объявляйте ненужных канов.</li><li>Помогайте дилеру, если он не ваш конкурент.</li><li>Не давайте дилеру собраться, если он ваш шимоча.</li></ul>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "234m 567m 78p 34s 22z 3z 5z", best: ["3z"], explain: "<strong>Позиция 1-е место в орасу</strong>. Приоритет — не набросить, а не выиграть. Сбрасываем 3W (чужой ветер) — слабейший тайл, может стать безопасным в будущем." },
      { hand: "123m 456m 789m 11p 2s 3s 5z", best: ["5z"], explain: "<strong>Позиция 4-е место</strong>. Нужно атаковать — 5 блоков есть. Сбрасываем одиночный 5Wh, чтобы сохранить структуру для быстрой победы." },
      { hand: "123m 456m 234p 567p 9s 5z", best: ["9s"], explain: "<strong>Позиция 2-е место</strong>. Можно немного рискнуть. 9S — терминал, терять его безопаснее, чем 5Wh (потенциальный якухай). Сброс 9S." }
    ], intro: "Приоритеты зависят от позиции: 1-е — защита, 4-е — атака, 2-3 — баланс." }
  ] },
{ id: "lesson-19", title: "Формальный темпай", desc: "Ценность и техники", prereqs: ["lesson-18"],
  blocks: [
    { type: "theory", title: "Ценность", html: `<p><strong>Формальный темпай</strong> — показать темпай в конце раздачи. Выплата 1000–3000 очков.</p><div class="example">Стандарт ASAPIN: 12-15 ход.</div>` },
    { type: "theory", title: "Пропорция", html: `<ul><li>Обычная рука — с 12-го хода.</li><li>+1 дора — сдвиг на 1 круг.</li><li>+2 доры — сдвиг на 2 круга.</li><li>Хорошие формы — на 1 круг раньше.</li><li>Плохие — на 1-2 раньше.</li></ul>` },
    { type: "theory", title: "Техники", html: `<ul><li>Пропуск взятия со стены.</li><li>Переброс безопасного тайла.</li><li>Увеличение взятий для других.</li></ul>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "234m 567m 78p 34s 22z 3z 5z", best: ["3z"], explain: "До конца раздачи далеко (условно ход 8). Ещё рано думать о <em>формальном темпае</em> — собирайте руку. Сброс 3W." },
      { hand: "123m 456m 789m 11p 2s 5z 9m", best: ["9m"], explain: "Близко к концу раздачи (условно ход 14). Пора думать о <em>формальном темпае</em> — старайтесь выйти в темпай даже с плохой формой. Сброс 9M (терминал)." },
      { hand: "123m 456m 234p 567p 5z 9s", best: ["9s"], explain: "4 сета + 2 одиночных. Пора в <em>формальный темпай</em>. Сброс 9S — оставляем 5Wh для потенциального якухая." }
    ], intro: "Стандарт ASAPIN: 12-15 ход — зона формального темпая." }
  ] },
{ id: "lesson-20", title: "Игра против открытых рук", desc: "Хоницу, кокуши, пон дор", prereqs: ["lesson-19"],
  blocks: [
    { type: "theory", title: "Чтение темпая", html: `<ul><li>3 сноса при 1 объявлении — темпай.</li><li>2 сноса при 2 объявлениях — темпай.</li><li>Сброс центральных — близко.</li></ul>` },
    { type: "theory", title: "Хоницу", html: `<ul><li>Не держите якухайные тайлы.</li><li>Думайте о темпае соперника.</li><li>Сброс тайла его масти супер опасен.</li></ul>` },
    { type: "theory", title: "Кокуши и пон дор", html: `<ul><li>Кокуши — 13 сирот.</li><li>Пон дор — быстро или дорого.</li><li>Дабутон дора — считайте темпай.</li></ul>` },
    { type: "practice", mode: "defense", tasks: [
      { hand: "2m 3m 4m 7p 8p 2s 3s 4s 5z 5z 1z 2z 9m", opponentDiscard: ["1p","2p","3p","4p","5p","6p","7p","8p"], riichiTile: "8p", safeDiscards: [], explain: "Противник сбрасывает только пины — это <strong>хоницу</strong> на пинах. Не сбрасывайте пины! Гэмбуцу: 2M, 7P, 8P. Судзи от 8P: 5P — <em>но это опасно против хоницу</em>. Лучший выбор: 2M (гэмбуцу)." },
      { hand: "1m 1m 5m 6m 7m 2p 3p 4p 2z 2z 5z 5z 9s", opponentDiscard: ["1s","3m","9p","3z","1m","2p"], riichiTile: "2p", safeDiscards: [], explain: "Противник сбросил 3M и 1M — значит, работает либо с манами, либо фолдит. Сброшенные тайлы могут быть безопасны. Гэмбуцу: 1M, 2P, 3M." },
      { hand: "3m 9m 1p 4p 7p 2s 5s 8s 5z 5z 1z 2z 7z", opponentDiscard: ["6m","3p","1z","9s","6m"], riichiTile: "6m", safeDiscards: [], explain: "Противник пронёс 6M дважды и не сбрасывает центральные — возможно, <strong>танки на 6M</strong> или <strong>кокуши</strong>. Будьте осторожны с терминалами и краевыми. Гэмбуцу: 3M, 9M, 3P, 1E, 9S." }
    ], intro: "Против хоницу не давайте тайлы его масти. Против кокуши следите за терминалами." }
  ] },
{ id: "lesson-21", title: "Открытия", desc: "Chi, pon, kan — когда и зачем", prereqs: ["lesson-20"],
  blocks: [
    { type: "theory", title: "Что такое открытие", html: `<p><strong>Наки</strong> (открытие) — взятие тайла из сброса соперника: чи, пон или открытый кан.</p><ul><li><strong>Плюс</strong> — скорость: вы сразу получаете готовый сет.</li><li><strong>Минус</strong> — теряете <em>риичи</em>, <em>ура-доры</em>, <em>иппэйко</em>, <em>мэнзэн цумо</em> и закрытые поны.</li></ul><div class="example">Открытая рука должна иметь <strong>конкретное яку</strong> — иначе выиграть нельзя.</div>` },
    { type: "theory", title: "Когда открываться", html: `<ul><li>Быстрые дешёвые руки: <em>таняо</em>, <em>якухай</em>.</li><li>Срочно нужна победа: догоняете, орасу.</li><li>Есть якухай (пон драконов или ветра раунда).</li></ul><p>НЕ открывайтесь, если есть потенциал на <em>пинфу</em>, <em>иппэйко</em>, <em>риичи</em> или <em>ура-доры</em>.</p>` },
    { type: "theory", title: "Атодзуке", html: `<p><strong>Атодзуке</strong> — открыть руку без яку, но с потенциалом его получить (например, пон дракона «на будущее»).</p><div class="example">Опасно: без яку рука не может выиграть. Нужно точно знать, какое яку появится.</div>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "234m 567m 78p 34s 22z 3z 5z", best: ["3z"], explain: "<strong>Дор в руке нет</strong>. Открытие не окупается — риичи даст +1 хан. Играем эффективно в закрытую. Сброс 3W." },
      { hand: "123m 456m 234p 567p 1z 5m", best: ["1z"], explain: "5M полезнее 1E. <strong>Рука стоит 2+ хана при риичи</strong> — открываться не стоит. Сброс 1E." },
      { hand: "234m 567m 78p 34s 55s 6z 1m", best: ["1m"], explain: "1M — терминал. <strong>Открытая рука теряет иппэйко и ура-доры</strong>, а у вас есть потенциал на пинфу. Сброс 1M, играем в закрытую." }
    ], intro: "Открытие оправдано, когда цена потери (риичи, ура-доры) окупается скоростью." }
  ] },
{ id: "lesson-22", title: "Перестроения", desc: "Изменение структуры руки", prereqs: ["lesson-21"],
  blocks: [
    { type: "theory", title: "Что такое перестроение", html: `<p><strong>Перестроение</strong> — намеренное изменение структуры руки в процессе раздачи. Часто с временной потерей шантэна.</p><div class="example">Оправдано в начале раздачи, когда шантэн ещё не критичен.</div>` },
    { type: "theory", title: "Когда перестраивать", html: `<ul><li>В начале раздачи (1–6 ход).</li><li>Когда хорошая форма лучше текущей: канчан → рянмен.</li><li>Из плохого ожидания в хорошее: пенчан → рянмен.</li><li>Из дешёвой руки в дорогую: добавить хоницу, таняо, иппэйко.</li></ul>` },
    { type: "theory", title: "Риски", html: `<ul><li>Потеря времени — соперник может выиграть.</li><li>Уменьшение шансов на победу.</li><li>Поздняя игра — <strong>не перестраивать</strong>.</li></ul>` },
    { type: "practice", mode: "efficiency", tasks: [
      { hand: "234m 567m 78p 34s 22z 3z 5z", best: ["3z"], explain: "В начале раздачи можно стремиться к хорошим формам, даже ценой потери шантэна. Но здесь структура уже хорошая — не перестраиваем. Сброс 3W." },
      { hand: "234m 567m 78p 24s 88s 5z 3z", best: ["3z"], explain: "Возможное перестроение: 24S (канчан) → 34S через 3S. Но пока рано. 5Wh может стать якухаем. Сброс 3W — слабейший тайл." },
      { hand: "123m 456m 234p 567p 9s 5z", best: ["9s"], explain: "Возможное перестроение: 9S → 45S или 78S (улучшение финальной формы). Но 9S — терминал, сейчас не стоит его держать. Сброс 9S." }
    ], intro: "Перестроение оправдано в начале раздачи, когда шантэн ещё не критичен." }
  ] },
{ id: "lesson-23", title: "Игра в орасу", desc: "Последняя раздача ханчана", prereqs: ["lesson-22"],
  blocks: [
    { type: "theory", title: "Что такое орасу", html: `<p><strong>Орасу</strong> — последняя раздача ханчана. Здесь каждое решение влияет на итоговое место.</p><p>Ключевые факторы: <em>ваша позиция</em>, <em>разница в очках</em>, <em>оставшееся время</em>.</p>` },
    { type: "theory", title: "Цели по позиции", html: `<ul><li><strong>1-е</strong> — удержать лидерство: не рисковать, не давать догнать.</li><li><strong>2-е</strong> — догнать 1-го: атаковать, но считать разницу.</li><li><strong>3-е</strong> — выжить / обойти 2-го: балансировать.</li><li><strong>4-е</strong> — любой ценой: атаковать агрессивно, рисковать.</li></ul>` },

/* ============ VALIDATION ============ */
function validateCourse() {
  const errors = [];
  for (const lesson of COURSE.lessons) {
    const cleaned = [];
    for (const b of lesson.blocks) {
      if (b.type === 'quiz') continue;
      cleaned.push(b);
    }
    lesson.blocks = cleaned;
    for (const b of lesson.blocks) {
      if (b.type !== 'practice') continue;
      const mode = b.mode || 'waits';
      for (const t of (b.tasks || [])) {
        const hand = parseHand(t.hand);
        if (hand.length !== 13 && hand.length !== 14) {
          errors.push(`${lesson.id}: неверная длина руки (${hand.length}): ${t.hand}`);
        }
        if (mode === 'waits') {
          if (hand.length === 13) {
            t.waits = findWaits(hand);
          } else if (hand.length === 14) {
            const best = findBestDiscards(hand);
            if (best.best.length > 0) {
              const d = best.best[0].discard;
              const h13 = hand.slice(); h13.splice(h13.indexOf(d), 1);
              t.waits = findWaits(h13);
            }
          }
        }
        if (mode === 'efficiency') {
          if (hand.length === 14) {
            const best = findBestDiscards(hand);
            if (best.best.length > 0) t.best = best.best.map(x => x.discard);
          }
        }
        if (mode === 'defense') {
          if (t.opponentDiscard && t.hand) {
            t.safeDiscards = computeSafeDiscards(hand, t.opponentDiscard);
          }
        }
      }
    }
  }
  if (errors.length > 0) console.warn('Course validation:', errors);
  return errors;
}
validateCourse();

/* ============ PRACTICE (в уроках) ============ */
function startPracticeBlock(block) {
  const container = document.getElementById('lesson-content');
  if (block.intro) {
    const intro = document.createElement('div'); intro.className = 'theory-block';
    intro.innerHTML = `<p>${escapeHtml(block.intro)}</p>`;
    container.appendChild(intro);
  }
  const taskContainer = document.createElement('div'); container.appendChild(taskContainer);
  let taskIdx = 0;
  function renderTask() {
    taskContainer.innerHTML = '';
    if (taskIdx >= block.tasks.length) {
      const nav = document.createElement('div'); nav.className = 'lesson-nav';
      const back = document.createElement('button'); back.className = 'secondary'; back.textContent = '← Назад';
      back.addEventListener('click', () => { if (currentBlockIndex > 0) { currentBlockIndex--; renderLessonBlock(); } });
      const right = document.createElement('div'); right.className = 'nav-right';
      const next = document.createElement('button'); next.className = 'primary';
      next.textContent = currentBlockIndex === COURSE.lessons[currentLessonIndex].blocks.length - 1 ? 'Завершить урок' : 'Далее →';
      next.addEventListener('click', () => {
        if (currentBlockIndex < COURSE.lessons[currentLessonIndex].blocks.length - 1) { currentBlockIndex++; renderLessonBlock(); }
        else { completeLesson(); }
      });
      right.appendChild(next);
      nav.appendChild(back); nav.appendChild(right);
      taskContainer.appendChild(nav);
      return;
    }
    const task = block.tasks[taskIdx];
    const q = document.createElement('div'); q.className = 'question';
    q.innerHTML = `<strong>Задача ${taskIdx + 1} / ${block.tasks.length}</strong>`;
    taskContainer.appendChild(q);
    const handDiv = document.createElement('div'); handDiv.className = 'hand';
    taskContainer.appendChild(handDiv);
    const paletteArea = document.createElement('div'); taskContainer.appendChild(paletteArea);
    const actions = document.createElement('div'); actions.className = 'actions';
    const clearBtn = document.createElement('button'); clearBtn.className = 'secondary'; clearBtn.textContent = '✕ Сбросить'; clearBtn.style.display = 'none';
    const checkBtn = document.createElement('button'); checkBtn.className = 'primary'; checkBtn.textContent = 'Проверить'; checkBtn.disabled = true;
    const nextBtn = document.createElement('button'); nextBtn.className = 'primary'; nextBtn.textContent = taskIdx === block.tasks.length - 1 ? 'К завершению' : 'Далее →'; nextBtn.style.display = 'none';
    actions.appendChild(clearBtn); actions.appendChild(checkBtn); actions.appendChild(nextBtn);
    taskContainer.appendChild(actions);
    const feedback = document.createElement('div'); feedback.className = 'feedback'; feedback.style.display = 'none';
    taskContainer.appendChild(feedback);
    const mode = block.mode || 'waits';
    let selected = new Set();
    let answered = false;
    function refresh() {
      if (mode === 'efficiency' && parseHand(task.hand).length === 14) {
        const sorted = sortHand(parseHand(task.hand));
        const drawn = sorted[sorted.length - 1];
        const first13 = sorted.slice(0, 13);
        handDiv.innerHTML = '';
        for (const t of first13) {
          const el = makeTile(t, { clickable: !answered, selected: selected.has(t) });
          el.addEventListener('click', () => { if (answered) return; selected.clear(); selected.add(t); checkBtn.disabled = false; clearBtn.style.display = ''; refresh(); });
          handDiv.appendChild(el);
        }
        const gap = document.createElement('div'); gap.className = 'draw-gap'; gap.textContent = '|';
        handDiv.appendChild(gap);
        const drawnEl = makeTile(drawn, { clickable: !answered, selected: selected.has(drawn), drawn: true });
        drawnEl.addEventListener('click', () => { if (answered) return; selected.clear(); selected.add(drawn); checkBtn.disabled = false; clearBtn.style.display = ''; refresh(); });
        handDiv.appendChild(drawnEl);
      } else {
        renderHand(handDiv, parseHand(task.hand), {
          clickable: !answered,
          selected,
          onClick: (t) => {
            if (answered) return;
            if (mode === 'efficiency' || mode === 'reading') { selected.clear(); selected.add(t); }
            else { if (selected.has(t)) selected.delete(t); else selected.add(t); }
            checkBtn.disabled = selected.size === 0;
            clearBtn.style.display = selected.size > 0 ? '' : 'none';
            refresh();
          }
        });
      }
    }
    clearBtn.addEventListener('click', () => { selected.clear(); checkBtn.disabled = true; clearBtn.style.display = 'none'; refresh(); });
    checkBtn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      checkBtn.style.display = 'none';
      clearBtn.style.display = 'none';
      nextBtn.style.display = '';
      let isCorrect = false;
      let correctSet = new Set();
      if (mode === 'waits') {
        correctSet = new Set(task.waits || []);
        isCorrect = selected.size === correctSet.size && [...selected].every(t => correctSet.has(t));
      } else if (mode === 'efficiency') {
        correctSet = new Set(task.best || []);
        isCorrect = selected.size === 1 && correctSet.has([...selected][0]);
      } else if (mode === 'defense') {
        correctSet = new Set(task.safeDiscards || []);
        isCorrect = selected.size === correctSet.size && [...selected].every(t => correctSet.has(t));
      } else if (mode === 'reading') {
        correctSet = new Set([task.correctAnswer]);
        isCorrect = selected.size === 1 && correctSet.has([...selected][0]);
      }
      STATE.stats.total++; if (isCorrect) STATE.stats.correct++; saveState(STATE);
      feedback.style.display = '';
      feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
      const head = document.createElement('div'); head.className = 'headline';
      head.textContent = isCorrect ? '✓ Правильно!' : '✗ Неправильно';
      feedback.appendChild(head);
      const ans = document.createElement('div'); ans.className = 'answer-block';
      const correctArr = [...correctSet].map(humanizeTile).join(', ') || '—';
      ans.innerHTML = `Правильный ответ: <strong>${correctArr}</strong>`;
      feedback.appendChild(ans);
      const exp = document.createElement('div'); exp.innerHTML = task.explain || '';
      feedback.appendChild(exp);
      taskIdx++;
      nextBtn.addEventListener('click', renderTask, { once: true });
    });
    refresh();
  }
  renderTask();
}

    return;
  }
  const list = document.createElement('div'); list.className = 'gloss-full-list';

    list.appendChild(item);
  }
  content.appendChild(list);

  checkBtn.style.display = '';
  checkBtn.disabled = true;
  clearBtn.style.display = 'none';
  paletteArea.innerHTML = '';
  hintRow.textContent = '';
  let selected = new Set();
  let answered = false;
  if (mode === 'waits') q.innerHTML = '<strong>Найдите все выигрышные тайлы (темпай).</strong>';
  else if (mode === 'efficiency') q.innerHTML = '<strong>Выберите лучший сброс.</strong> Обратите внимание: 13 тайлов, разделитель, взятый тайл.';
  else if (mode === 'defense') q.innerHTML = '<strong>Противник объявил риичи.</strong> Выберите все безопасные тайлы для сброса.';
  else if (mode === 'reading') q.innerHTML = '<strong>Какой тайл самый опасный?</strong> Выберите один.';
  if ((mode === 'defense' || mode === 'reading') && problem.opponentDiscard) {
    const label = document.createElement('div'); label.className = 'palette-label'; label.textContent = 'Дискард противника:';
    paletteArea.appendChild(label);
    const row = document.createElement('div'); row.className = 'discard-row';
    for (const t of problem.opponentDiscard) row.appendChild(makeTile(t, { small: true }));
    paletteArea.appendChild(row);
  }
  function refresh() {
    const tiles = parseHand(problem.hand);
    if (mode === 'efficiency' && tiles.length === 14) {
      const sorted = sortHand(tiles);
      const drawn = sorted[sorted.length - 1];
      const first13 = sorted.slice(0, 13);
      handDiv.innerHTML = '';
      for (const t of first13) {
        const el = makeTile(t, { clickable: !answered, selected: selected.has(t) });
        el.addEventListener('click', () => { if (answered) return; selected.clear(); selected.add(t); checkBtn.disabled = false; clearBtn.style.display = ''; refresh(); });
        handDiv.appendChild(el);
      }
      const gap = document.createElement('div'); gap.className = 'draw-gap'; gap.textContent = '|';
      handDiv.appendChild(gap);
      const drawnEl = makeTile(drawn, { clickable: !answered, selected: selected.has(drawn), drawn: true });
      drawnEl.addEventListener('click', () => { if (answered) return; selected.clear(); selected.add(drawn); checkBtn.disabled = false; clearBtn.style.display = ''; refresh(); });
      handDiv.appendChild(drawnEl);
    } else {
      renderHand(handDiv, tiles, {
        clickable: !answered,
        selected,
        onClick: (t) => {
          if (answered) return;
          if (mode === 'efficiency' || mode === 'reading') { selected.clear(); selected.add(t); }
          else { if (selected.has(t)) selected.delete(t); else selected.add(t); }
          checkBtn.disabled = selected.size === 0;
          clearBtn.style.display = selected.size > 0 ? '' : 'none';
          refresh();
        }
      });
    }
  }
  refresh();
  clearBtn.onclick = () => { selected.clear(); checkBtn.disabled = true; clearBtn.style.display = 'none'; refresh(); };
  checkBtn.onclick = () => {
    if (answered) return;
    answered = true;
    checkBtn.style.display = 'none';
    clearBtn.style.display = 'none';
    nextBtn.style.display = '';
    let correctSet = new Set();
    let isCorrect = false;
    if (mode === 'waits') { correctSet = new Set(problem.waits); isCorrect = selected.size === correctSet.size && [...selected].every(t => correctSet.has(t)); }
    else if (mode === 'efficiency') { correctSet = new Set(problem.best); isCorrect = selected.size === 1 && correctSet.has([...selected][0]); }
    else if (mode === 'defense') { correctSet = new Set(problem.safeDiscards); isCorrect = selected.size === correctSet.size && [...selected].every(t => correctSet.has(t)); }
    else if (mode === 'reading') { correctSet = new Set([problem.correctAnswer]); isCorrect = selected.size === 1 && correctSet.has([...selected][0]); }
    STATE.stats.total++; if (isCorrect) STATE.stats.correct++; saveState(STATE);
    feedback.style.display = '';
    feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
    const head = document.createElement('div'); head.className = 'headline';
    head.textContent = isCorrect ? '✓ Правильно!' : '✗ Неправильно';
    feedback.appendChild(head);
    const ans = document.createElement('div'); ans.className = 'answer-block';
    ans.innerHTML = `Правильный ответ: <strong>${[...correctSet].map(humanizeTile).join(', ') || '—'}</strong>`;
    feedback.appendChild(ans);
    const exp = document.createElement('div'); exp.innerHTML = problem.explain || '';
    feedback.appendChild(exp);
  };
  nextBtn.onclick = () => { startFreePractice(mode); };
}

/* ============ SETTINGS ============ */
function renderSettings() {
  const total = COURSE.lessons.length;
  let completed = 0;
  COURSE.lessons.forEach(l => { if (STATE.completed[l.id]) completed++; });
  document.getElementById('course-progress-desc').textContent = `Пройдено: ${completed} из ${total}`;
  const stats = STATE.stats || { correct: 0, total: 0 };
  const acc = stats.total > 0 ? Math.round(stats.correct / stats.total * 100) : 0;
  document.getElementById('settings-stats-desc').textContent = `Правильно: ${stats.correct} из ${stats.total} (${acc}%)`;
}
document.getElementById('btn-reset-course').addEventListener('click', () => {
  if (!confirm('Сбросить прогресс курса?')) return;
  STATE.completed = {}; saveState(STATE); renderSettings(); renderCourses(); toast('Прогресс курса сброшен');
});
document.getElementById('btn-reset-stats').addEventListener('click', () => {
  if (!confirm('Сбросить статистику?')) return;
  STATE.stats = { correct: 0, total: 0 }; saveState(STATE); renderSettings(); toast('Статистика сброшена');
});
document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'riichi-progress.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Экспортировано');
});
document.getElementById('btn-import').addEventListener('click', () => document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data && typeof data === 'object') { STATE = data; saveState(STATE); renderSettings(); renderCourses(); toast('Импортировано'); }
    } catch (err) { toast('Ошибка импорта'); }
  };
  reader.readAsText(f);
});
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ============ HOME STATS ============ */
function renderHomeStats() {
  const stats = STATE.stats || { correct: 0, total: 0 };
  const acc = stats.total > 0 ? Math.round(stats.correct / stats.total * 100) : 0;
  let completed = 0;
  COURSE.lessons.forEach(l => { if (STATE.completed[l.id]) completed++; });
  document.getElementById('stats-mini').innerHTML = `
    <span>Уроков: <strong>${completed}/${COURSE.lessons.length}</strong></span>
    <span>Задач: <strong>${stats.total}</strong></span>
    <span>Точность: <strong>${acc}%</strong></span>
  `;
}

/* ============ INIT ============ */
renderHomeStats();
renderCourses();
renderSettings();
</script>
