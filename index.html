function getLessonById(id) { return COURSE.lessons.find(l => l.id === id); }

/* ============ PREPROCESSING: Валидация задач один раз при загрузке ============ */
(function validateAllTasks() {
    let totalFixed = 0;
    for (const lesson of COURSE.lessons) {
        for (const block of lesson.blocks) {
            if (block.type !== 'practice') continue;
            const orig = block.tasks.length;
            block.tasks = block.tasks.filter(t => {
                const hand = parseHand(t.hand);
                if (block.mode === 'waits' || block.mode === 'defense' || block.mode === 'reading') return hand.length === 13;
                if (block.mode === 'efficiency') return hand.length === 14;
                return true;
            });
            if (block.tasks.length < orig) { totalFixed += orig - block.tasks.length; console.warn('[COURSE] ' + lesson.id + ': filtered ' + (orig - block.tasks.length) + ' invalid tasks'); }
        }
    }
    if (totalFixed > 0) console.warn('[COURSE] Total invalid tasks filtered:', totalFixed);
})();

/* ============ STORAGE ============ */
const STORAGE_KEY = 'mahjong-course-v3';
let store = { correct: 0, total: 0, tagStats: {}, courseProgress: {} };
try { const s = localStorage.getItem(STORAGE_KEY); if (s) store = { ...store, ...JSON.parse(s) }; } catch(e) {}
let _storageWarned = false;
function saveStore() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (e) { if (!_storageWarned) { _storageWarned = true; setTimeout(() => showToast('⚠️ Не удалось сохранить прогресс.'), 500); } } }
function getLessonProgress(lessonId) {
    if (!store.courseProgress[lessonId]) store.courseProgress[lessonId] = { done: false, currentBlock: 0, blockPassed: [] };
    return store.courseProgress[lessonId];
}
function isLessonUnlocked(lessonId) {
    const lesson = getLessonById(lessonId);
    if (!lesson) return false;
    if (!lesson.prereqs || lesson.prereqs.length === 0) return true;
    return lesson.prereqs.every(pid => getLessonProgress(pid).done);
}
function courseCompletedCount() { let n = 0; for (const l of COURSE.lessons) if (getLessonProgress(l.id).done) n++; return n; }
function trackTag(tags, correct) { if (!tags) return; for (const tag of tags) { if (!store.tagStats[tag]) store.tagStats[tag] = { correct: 0, total: 0 }; store.tagStats[tag].total++; if (correct) store.tagStats[tag].correct++; } saveStore(); }

/* ============ STATE ============ */
const state = {
    problems: [], currentIdx: 0, correctCount: 0, totalAnswered: 0,
    selectedTiles: new Set(), selectedIndices: new Set(), selectedDiscard: null,
    answered: false,
    lessonPractice: null, currentLesson: null,
    practiceMode: null,
    sessionErrors: []
};

/* ============ UI HELPERS ============ */
function $(id) { return document.getElementById(id); }
function showScreen(name) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $('screen-' + name).classList.add('active'); window.scrollTo(0, 0); }
function showToast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2400); }
function updateHome() {
    const completed = courseCompletedCount(), total = COURSE.lessons.length;
    $('course-hero-progress').style.width = Math.round((completed / total) * 100) + '%';
    $('course-hero-text').textContent = `Пройдено уроков: ${completed} из ${total}`;
    $('courses-summary').textContent = `${completed} из ${total} уроков пройдено`;
    const acc = store.total > 0 ? Math.round(store.correct / store.total * 100) : 0;
    $('stats-mini').innerHTML = `<span>Правильных: <strong>${store.correct}</strong></span><span>Решено: <strong>${store.total}</strong></span><span>Точность: <strong>${store.total > 0 ? acc + '%' : '—'}</strong></span>`;
    $('course-progress-desc').textContent = `Пройдено уроков: ${completed} из ${total}.`;
    $('settings-stats-desc').textContent = `Правильных: ${store.correct}, всего решено: ${store.total}.`;
}

/* ============ TILE RENDERING ============ */
function makeTile(code, opts = {}) {
    const el = document.createElement('div');
    el.className = 'tile ' + code[1];
    if (opts.small) el.classList.add('small');
    if (opts.clickable) el.classList.add('clickable');
    if (opts.disabled) el.classList.add('disabled');
    el.dataset.code = code;
    const n = code[0], s = code[1];
    if (s === 'z') { const label = HONOR_CHAR[+n]; el.innerHTML = `<span class="honor${label.length > 1 ? ' honor-wide' : ''}">${label}</span>`; }
    else el.innerHTML = `<span class="num">${n}</span><span class="suit">${SUIT_CHAR[s]}</span>`;
    return el;
}

/* ============ FULL GLOSSARY RENDERING ============ */
let currentGlossQuery = '';
let currentGlossCategory = 'all';

function renderGlossCategories() {
    const container = $('glossCategories');
    container.innerHTML = GLOSSARY_CATEGORIES.map(cat =>
        `<button class="gloss-cat-btn ${cat.id === currentGlossCategory ? 'active' : ''}" data-cat="${cat.id}">${cat.icon} ${cat.name}</button>`
    ).join('');
    container.querySelectorAll('.gloss-cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            currentGlossCategory = btn.dataset.cat;
            renderGlossCategories();
            renderFullGlossary();
        });
    });
}
function highlightText(text, query) {
    if (!query) return text;
    try {
        const re = new RegExp('(' + escapeRegex(query) + ')', 'gi');
        return text.replace(re, '<mark>$1</mark>');
    } catch (e) { return text; }
}
function renderFullGlossary() {
    const query = currentGlossQuery.trim().toLowerCase();
    let filtered = GLOSSARY;
    if (currentGlossCategory !== 'all') filtered = filtered.filter(g => g.cat === currentGlossCategory);
    if (query) filtered = filtered.filter(g => g.term.toLowerCase().includes(query) || (g.ja && g.ja.toLowerCase().includes(query)) || g.def.toLowerCase().includes(query));
    const container = $('glossContent');
    const info = $('glossSearchInfo');
    if (filtered.length === 0) {
        container.innerHTML = `<div class="gloss-no-results"><div class="icon">🔍</div><div>Ничего не найдено по запросу «${currentGlossQuery}»</div></div>`;
        info.textContent = `Найдено: 0 из ${GLOSSARY.length}`;
        return;
    }
    if (currentGlossCategory === 'all' && !query) {
        const grouped = {};
        for (const g of filtered) { if (!grouped[g.cat]) grouped[g.cat] = []; grouped[g.cat].push(g); }
        let html = '';
        for (const cat of GLOSSARY_CATEGORIES) {
            if (cat.id === 'all') continue;
            if (!grouped[cat.id]) continue;
            html += `<div class="gloss-section-title">${cat.icon} ${cat.name} <span class="count">(${grouped[cat.id].length})</span></div>`;
            html += `<div class="gloss-full-list">`;
            for (const g of grouped[cat.id]) html += renderFullGlossItem(g, '');
            html += `</div>`;
        }
        container.innerHTML = html;
    } else {
        let html = `<div class="gloss-full-list">`;
        for (const g of filtered) html += renderFullGlossItem(g, query);
        html += `</div>`;
        container.innerHTML = html;
    }
    info.textContent = `Найдено: ${filtered.length} из ${GLOSSARY.length}`;
}
function renderFullGlossItem(item, query) {
    const term = query ? highlightText(item.term, query) : item.term;
    const ja = item.ja ? `<span class="ja">${item.ja}</span>` : '';
    const def = query ? highlightText(item.def, query) : item.def;
    return `<div class="gloss-full-item"><div class="term">${term} ${ja}</div><div class="definition">${def}</div></div>`;
}

/* ============ COURSES LIST ============ */
function renderCourses() {
    const container = $('courses-list');
    let html = '';
    for (let i = 0; i < COURSE.lessons.length; i++) {
        const l = COURSE.lessons[i];
        const prog = getLessonProgress(l.id);
        const unlocked = isLessonUnlocked(l.id);
        const done = prog.done;
        const classes = ['lesson-card'];
        if (done) classes.push('completed');
        if (!unlocked) classes.push('locked');
        const progressPct = done ? 100 : Math.round((prog.currentBlock / l.blocks.length) * 100);
        let lockInfo = '';
        if (!unlocked) { const missing = l.prereqs.map(pid => getLessonById(pid).title).join(', '); lockInfo = `🔒 Требуется: ${missing}`; }
        html += `<div class="${classes.join(' ')}" data-lesson="${l.id}">
            <div class="lesson-num">${done ? '✓' : i + 1}</div>
            <div class="lesson-info">
                <div class="lesson-title">${l.title}</div>
                <div class="lesson-desc">${lockInfo || l.desc}</div>
                ${unlocked ? `<div class="lesson-progress-bar"><div class="lesson-progress-fill" style="width:${progressPct}%"></div></div>` : ''}
            </div>
            <div class="lesson-arrow">${done ? '↻' : '›'}</div>
        </div>`;
    }
    container.innerHTML = html;
    container.querySelectorAll('.lesson-card').forEach(card => {
        card.addEventListener('click', () => {
            const id = card.dataset.lesson;
            if (!isLessonUnlocked(id)) { showToast('🔒 Сначала завершите предыдущие уроки'); return; }
            openLesson(id);
        });
    });
}
function openLesson(lessonId) {
    const lesson = getLessonById(lessonId); if (!lesson) return;
    const prog = getLessonProgress(lessonId);
    state.currentLesson = { id: lessonId, blockIndex: prog.currentBlock || 0 };
    showScreen('lesson'); renderLesson();
}

/* ============ LESSON VIEW ============ */
function renderLesson() {
    if (!state.currentLesson) { showScreen('courses'); return; }
    const lesson = getLessonById(state.currentLesson.id);
    const prog = getLessonProgress(lesson.id);
    let blockIdx = state.currentLesson.blockIndex;
    if (blockIdx >= lesson.blocks.length) blockIdx = lesson.blocks.length;
    state.currentLesson.blockIndex = blockIdx;

    $('lesson-progress').textContent = `Урок ${COURSE.lessons.indexOf(lesson) + 1} / ${COURSE.lessons.length}`;
    const container = $('lesson-content');

    let html = `<div class="lesson-header"><div class="l-title">${lesson.title}</div><div class="l-desc">${lesson.desc}</div></div>`;
    html += `<div class="lesson-progress-dots">`;
    for (let i = 0; i < lesson.blocks.length; i++) {
        const cls = i < blockIdx ? 'done' : (i === blockIdx ? 'active' : '');
        html += `<div class="lesson-dot ${cls}"></div>`;
    }
    html += `</div>`;

    if (blockIdx >= lesson.blocks.length) {
        html += `<div class="lesson-complete-banner">
            <div class="icon">🎉</div>
            <h3>Урок завершён!</h3>
            <p>${prog.done ? 'Вы успешно прошли этот урок. Можно переходить к следующему.' : 'Урок завершён.'}</p>
        </div>`;
        html += `<div class="lesson-nav">
            <button class="secondary" id="btn-lesson-to-courses">← К урокам</button>
            <div class="nav-right">
                <button class="secondary" id="btn-lesson-restart">Повторить</button>
                <button class="primary" id="btn-lesson-next">Следующий урок →</button>
            </div>
        </div>`;
        container.innerHTML = html;
        if (!prog.done) { prog.done = true; saveStore(); }
        renderGlossary(container, lesson.title + ' ' + lesson.desc + ' ' + lesson.blocks.map(b => (b.html || '') + ' ' + (b.title || '') + ' ' + (b.intro || '')).join(' '));
        $('btn-lesson-to-courses').addEventListener('click', () => { renderCourses(); showScreen('courses'); });
        $('btn-lesson-restart').addEventListener('click', () => { prog.currentBlock = 0; prog.done = false; state.currentLesson.blockIndex = 0; saveStore(); renderLesson(); });
        $('btn-lesson-next').addEventListener('click', () => {
            const idx = COURSE.lessons.indexOf(lesson);
            if (idx + 1 < COURSE.lessons.length) {
                const nextId = COURSE.lessons[idx + 1].id;
                if (isLessonUnlocked(nextId)) openLesson(nextId);
                else { showToast('Следующий урок пока заблокирован'); renderCourses(); showScreen('courses'); }
            } else { showToast('🎓 Вы прошли весь курс!'); renderCourses(); showScreen('courses'); }
        });
        return;
    }

    const block = lesson.blocks[blockIdx];
    $('lesson-score').textContent = `Блок ${blockIdx + 1}/${lesson.blocks.length}`;

    if (block.type === 'theory') {
        html += `<div class="theory-block"><h3>${block.title}</h3>${block.html}</div>`;
        html += `<div class="lesson-nav">
            <button class="secondary" id="btn-lesson-back-courses">← К урокам</button>
            <div class="nav-right">
                ${blockIdx > 0 ? '<button class="secondary" id="btn-lesson-prev">← Назад</button>' : ''}
                <button class="primary" id="btn-lesson-continue">Продолжить →</button>
            </div>
        </div>`;
    } else if (block.type === 'quiz') {
        html += `<div class="quiz-block">
            <h3>${block.title}</h3>
            <div class="quiz-options">
                ${block.options.map((opt, i) => `<button class="quiz-option" data-idx="${i}">${opt}</button>`).join('')}
            </div>
            <div class="feedback" id="lesson-quiz-feedback" style="display:none;"></div>
        </div>`;
        html += `<div class="lesson-nav">
            <button class="secondary" id="btn-lesson-back-courses">← К урокам</button>
            <div class="nav-right">
                ${blockIdx > 0 ? '<button class="secondary" id="btn-lesson-prev">← Назад</button>' : ''}
                <button class="primary" id="btn-lesson-continue" disabled>Далее →</button>
            </div>
        </div>`;
    } else if (block.type === 'practice') {
        const modeName = block.mode === 'waits' ? 'Ожидания' : block.mode === 'efficiency' ? 'Эффективный сброс' : block.mode === 'defense' ? 'Защита' : 'Чтение дискарда';
        const passThreshold = Math.max(2, Math.ceil(block.tasks.length * 0.6));
        html += `<div class="theory-block">
            <h3>Практика: ${modeName}</h3>
            <p>${block.intro || 'Примените знания на практике.'}</p>
            <p><strong>Задач в блоке:</strong> ${block.tasks.length}. Нужно правильно ответить минимум на ${passThreshold}.</p>
        </div>`;
        html += `<div class="lesson-nav">
            <button class="secondary" id="btn-lesson-back-courses">← К урокам</button>
            <div class="nav-right">
                ${blockIdx > 0 ? '<button class="secondary" id="btn-lesson-prev">← Назад</button>' : ''}
                <button class="primary" id="btn-lesson-start-practice">Начать практику →</button>
            </div>
        </div>`;
    }
    container.innerHTML = html;

    if (block.type === 'theory' || block.type === 'quiz') {
        const blockText = (block.html || '') + ' ' + (block.title || '') + ' ' + (block.options || []).join(' ') + ' ' + (block.explain || '');
        renderGlossary(container, blockText);
    }

    if ($('btn-lesson-back-courses')) $('btn-lesson-back-courses').addEventListener('click', () => { renderCourses(); showScreen('courses'); });
    if ($('btn-lesson-prev')) $('btn-lesson-prev').addEventListener('click', () => {
        state.currentLesson.blockIndex = Math.max(0, blockIdx - 1);
        getLessonProgress(lesson.id).currentBlock = state.currentLesson.blockIndex;
        saveStore(); renderLesson();
    });
    if ($('btn-lesson-continue')) $('btn-lesson-continue').addEventListener('click', () => {
        state.currentLesson.blockIndex = blockIdx + 1;
        getLessonProgress(lesson.id).currentBlock = state.currentLesson.blockIndex;
        saveStore(); renderLesson();
    });
    if (block.type === 'quiz') {
        let answered = false;
        container.querySelectorAll('.quiz-option').forEach(btn => {
            btn.addEventListener('click', () => {
                if (answered) return; answered = true;
                const idx = +btn.dataset.idx; const isCorrect = idx === block.correct;
                container.querySelectorAll('.quiz-option').forEach((b, i) => {
                    b.disabled = true;
                    if (i === block.correct) b.classList.add('correct');
                    else if (i === idx) b.classList.add('incorrect');
                });
                const fb = $('lesson-quiz-feedback');
                fb.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
                fb.style.display = 'block';
                fb.innerHTML = `<div class="headline">${isCorrect ? '✓ Верно!' : '✗ Неверно'}</div><div style="margin-top:0.4rem;">${block.explain}</div>`;
                $('btn-lesson-continue').disabled = false;
            });
        });
    }
    if (block.type === 'practice') {
        $('btn-lesson-start-practice').addEventListener('click', () => startLessonPractice(lesson.id, blockIdx, block));
    }
}

/* ============ PRACTICE START ============ */
function startLessonPractice(lessonId, blockIndex, block) {
    state.lessonPractice = { lessonId, blockIndex, block };
    state.practiceMode = null;
    state.problems = block.tasks.map(t => ({ ...t, type: block.mode }));
    state.currentIdx = 0; state.correctCount = 0; state.totalAnswered = 0;
    state.answered = false; state.sessionErrors = [];
    showScreen('quiz'); loadQuestion();
}
function startFreePractice(mode) {
    state.lessonPractice = null;
    state.practiceMode = mode;
    state.problems = [];
    state.currentIdx = 0; state.correctCount = 0; state.totalAnswered = 0;
    state.answered = false; state.sessionErrors = [];
    showScreen('quiz');
    $('question').innerHTML = '<div class="loading"><span class="spinner"></span>Генерация задач...</div>';
    $('hand').innerHTML = ''; $('palette-area').innerHTML = '';
    $('feedback').style.display = 'none';
    $('btn-check').style.display = 'none'; $('btn-next').style.display = 'none'; $('btn-clear').style.display = 'none';
    $('hint-row').textContent = '';
    setTimeout(() => {
        const rng = makeRng(Date.now() ^ (Math.random() * 1e9));
        for (let i = 0; i < 8; i++) {
            let p;
            if (mode === 'waits') p = generateWaitProblem(rng);
            else if (mode === 'efficiency') p = generateEfficiencyProblem(rng);
            else if (mode === 'defense') p = generateDefenseProblem(rng);
            else if (mode === 'reading') p = generateDiscardReadingProblem(rng);
            if (!p) continue;
            p.type = mode;
            state.problems.push(p);
        }
        if (state.problems.length === 0) { $('question').innerHTML = 'Не удалось сгенерировать задачи. Попробуйте ещё раз.'; return; }
        loadQuestion();
    }, 50);
}

/* ============ QUIZ LOGIC ============ */
function updateClearButton() {
    const hasSelection = state.selectedTiles.size > 0 || state.selectedDiscard !== null || state.selectedIndices.size > 0;
    const btn = $('btn-clear'); if (!btn) return;
    btn.style.display = (hasSelection && !state.answered) ? 'inline-block' : 'none';
}
function loadQuestion() {
    state.selectedTiles = new Set(); state.selectedIndices = new Set(); state.selectedDiscard = null;
    state.answered = false;
    const p = state.problems[state.currentIdx];
    if (!p) { finishSession(); return; }

    if (state.lessonPractice) $('progress').textContent = `Урок · Блок ${state.lessonPractice.blockIndex + 1}: ${state.currentIdx + 1} / ${state.problems.length}`;
    else $('progress').textContent = `${state.currentIdx + 1} / ${state.problems.length}`;
    $('score').textContent = `✓ ${state.correctCount} из ${state.totalAnswered}`;
    $('feedback').style.display = 'none';
    $('btn-check').style.display = 'inline-block'; $('btn-check').disabled = true;
    $('btn-next').style.display = 'none'; $('btn-clear').style.display = 'none';
    $('hint-row').textContent = '';

    const qEl = $('question'), hEl = $('hand'), pEl = $('palette-area');
    qEl.innerHTML = ''; hEl.innerHTML = ''; pEl.innerHTML = '';

    if (p.type === 'waits') {
        qEl.innerHTML = `<strong>Ожидания.</strong> Определите все выигрышные тайлы. Повторный клик снимает выбор.`;
        sortHand(parseHand(p.hand)).forEach(t => hEl.appendChild(makeTile(t)));
        renderPalette(pEl);
    } else if (p.type === 'efficiency') {
        qEl.innerHTML = `<strong>Эффективный сброс.</strong> Выберите сброс, дающий лучший 1-шантэн (после сброса до темпая останется 1 тайл).`;
        sortHand(parseHand(p.hand)).forEach(t => {
            const el = makeTile(t, { clickable: true });
            el.addEventListener('click', () => {
                if (state.answered) return;
                if (state.selectedDiscard === t) { el.classList.remove('selected'); state.selectedDiscard = null; }
                else { document.querySelectorAll('#hand .tile').forEach(x => x.classList.remove('selected')); el.classList.add('selected'); state.selectedDiscard = t; }
                $('btn-check').disabled = state.selectedDiscard === null;
                updateClearButton();
            });
            hEl.appendChild(el);
        });
    } else if (p.type === 'defense') {
        qEl.innerHTML = `<strong>Защита.</strong> Противник объявил риичи. Выберите <strong>все</strong> наиболее безопасные тайлы.`;
        const oppLabel = document.createElement('div'); oppLabel.className = 'palette-label'; oppLabel.textContent = 'Сбросы противника (риичи-тайл выделен):'; pEl.appendChild(oppLabel);
        const oppWrap = document.createElement('div'); oppWrap.className = 'discard-row';
        sortHand(p.opponentDiscard).forEach(t => { const el = makeTile(t, { small: true, disabled: true }); if (t === p.riichiTile) el.style.outline = '2px solid #d4a373'; oppWrap.appendChild(el); });
        pEl.appendChild(oppWrap);
        const myLabel = document.createElement('div'); myLabel.className = 'palette-label'; myLabel.textContent = 'Ваша рука (нажмите на каждый тайл отдельно):'; pEl.appendChild(myLabel);
        sortHand(parseHand(p.hand)).forEach((t, idx) => {
            const el = makeTile(t, { clickable: true });
            el.dataset.idx = idx;
            el.addEventListener('click', () => {
                if (state.answered) return;
                if (state.selectedIndices.has(idx)) { state.selectedIndices.delete(idx); el.classList.remove('selected'); }
                else { state.selectedIndices.add(idx); el.classList.add('selected'); }
                $('btn-check').disabled = state.selectedIndices.size === 0;
                updateClearButton();
            });
            hEl.appendChild(el);
        });
    } else if (p.type === 'reading') {
        qEl.innerHTML = `<strong>Чтение дискарда.</strong> Противник в темпае (риичи). По его дискарду определите, какой из предложенных тайлов <strong>самый опасный</strong> для сброса.`;
        const oppLabel = document.createElement('div'); oppLabel.className = 'palette-label'; oppLabel.textContent = 'Дискард противника:'; pEl.appendChild(oppLabel);
        const oppWrap = document.createElement('div'); oppWrap.className = 'discard-row';
        sortHand(p.opponentDiscard).forEach(t => { const el = makeTile(t, { small: true, disabled: true }); oppWrap.appendChild(el); });
        pEl.appendChild(oppWrap);
        const candLabel = document.createElement('div'); candLabel.className = 'candidates-label'; candLabel.textContent = 'Выберите САМЫЙ опасный тайл:'; pEl.appendChild(candLabel);
        sortHand(p.hand).forEach(t => {
            const el = makeTile(t, { clickable: true });
            el.addEventListener('click', () => {
                if (state.answered) return;
                document.querySelectorAll('#hand .tile').forEach(x => x.classList.remove('selected'));
                el.classList.add('selected'); state.selectedDiscard = t;
                $('btn-check').disabled = false;
                updateClearButton();
            });
            hEl.appendChild(el);
        });
    }
}
function renderPalette(container) {
    const label = document.createElement('div'); label.className = 'palette-label'; label.textContent = 'Палитра тайлов (нажмите для выбора):'; container.appendChild(label);
    const pal = document.createElement('div'); pal.className = 'palette';
    const addGroup = (codes) => {
        const g = document.createElement('div'); g.className = 'suit-group';
        for (const code of codes) {
            const t = makeTile(code, { small: true, clickable: true });
            t.addEventListener('click', () => {
                if (state.answered) return;
                if (state.selectedTiles.has(code)) { state.selectedTiles.delete(code); t.classList.remove('selected'); }
                else { state.selectedTiles.add(code); t.classList.add('selected'); }
                $('btn-check').disabled = state.selectedTiles.size === 0;
                updateClearButton();
            });
            g.appendChild(t);
        }
        pal.appendChild(g);
    };
    addGroup(['1m','2m','3m','4m','5m','6m','7m','8m','9m']);
    addGroup(['1p','2p','3p','4p','5p','6p','7p','8p','9p']);
    addGroup(['1s','2s','3s','4s','5s','6s','7s','8s','9s']);
    addGroup(['1z','2z','3z','4z','5z','6z','7z']);
    container.appendChild(pal);
}
function checkAnswer() {
    if (state.answered) return;
    const p = state.problems[state.currentIdx];
    let correct = false, answerText = '';
    if (p.type === 'waits') {
        const cs = new Set(p.waits);
        correct = state.selectedTiles.size === cs.size;
        if (correct) for (const t of state.selectedTiles) if (!cs.has(t)) { correct = false; break; }
        document.querySelectorAll('#palette-area .tile').forEach(el => { const c = el.dataset.code; if (cs.has(c)) el.classList.add('correct'); else if (state.selectedTiles.has(c)) el.classList.add('incorrect'); });
        answerText = `Правильные тайлы: <strong>${p.waits.map(humanizeTile).join(', ')}</strong>`;
    } else if (p.type === 'efficiency') {
        const acc = new Set(p.best);
        correct = acc.has(state.selectedDiscard);
        document.querySelectorAll('#hand .tile').forEach(el => { const c = el.dataset.code; if (c === state.selectedDiscard) el.classList.add(correct ? 'correct' : 'incorrect'); else if (acc.has(c)) el.classList.add('correct'); });
        answerText = `Лучший сброс: <strong>${p.best.map(humanizeTile).join(' или ')}</strong>`;
    } else if (p.type === 'defense') {
        const safe = new Set(p.safeDiscards);
        const handSorted = sortHand(parseHand(p.hand));
        const selectedCodes = new Set();
        for (const idx of state.selectedIndices) { if (idx >= 0 && idx < handSorted.length) selectedCodes.add(handSorted[idx]); }
        correct = selectedCodes.size === safe.size;
        if (correct) for (const c of selectedCodes) if (!safe.has(c)) { correct = false; break; }
        document.querySelectorAll('#hand .tile').forEach(el => { const c = el.dataset.code; if (safe.has(c)) el.classList.add('correct'); else if (el.classList.contains('selected')) el.classList.add('incorrect'); });
        answerText = `Наиболее безопасные: <strong>${p.safeDiscards.map(humanizeTile).join(', ')}</strong>`;
    } else if (p.type === 'reading') {
        correct = state.selectedDiscard === p.correctAnswer;
        document.querySelectorAll('#hand .tile').forEach(el => {
            const c = el.dataset.code;
            if (c === p.correctAnswer) el.classList.add('correct');
            else if (c === state.selectedDiscard && !correct) el.classList.add('incorrect');
        });
        answerText = `Самый опасный тайл: <strong>${humanizeTile(p.correctAnswer)}</strong>`;
    }
    state.answered = true; state.totalAnswered++; store.total++;
    if (correct) { state.correctCount++; store.correct++; }
    trackTag(p.tags, correct);
    saveStore();
    $('score').textContent = `✓ ${state.correctCount} из ${state.totalAnswered}`;
    const fb = $('feedback');
    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
    fb.style.display = 'block';
    fb.innerHTML = `<div class="headline">${correct ? '✓ Верно!' : '✗ Неверно'}</div><div class="answer-block">${answerText}</div><div style="margin-top:0.6rem;">${p.explain || ''}</div>`;
    $('btn-check').style.display = 'none'; $('btn-clear').style.display = 'none';
    const nb = $('btn-next'); nb.style.display = 'inline-block';
    nb.textContent = (state.currentIdx + 1 < state.problems.length) ? 'Далее →' : (state.lessonPractice ? 'Завершить блок' : 'Результаты');
    $('hint-row').textContent = 'Enter — далее';
}
function nextQuestion() {
    if (state.currentIdx + 1 < state.problems.length) { state.currentIdx++; loadQuestion(); }
    else finishSession();
}
function finishSession() {
    if (state.lessonPractice) { finishLessonPractice(); return; }
    const total = state.problems.length, correct = state.correctCount;
    const pct = total > 0 ? Math.round(correct / total * 100) : 0;
    let msg = pct >= 90 ? '🏆 Отличный результат!' : pct >= 70 ? '👍 Хорошо, есть куда расти.' : '💪 Стоит потренироваться ещё.';
    $('results-content').innerHTML = `
        <div class="result-message">${msg}</div>
        <div class="results-grid">
            <div class="result-card"><div class="value">${correct}</div><div class="label">Правильно</div></div>
            <div class="result-card"><div class="value">${total}</div><div class="label">Всего</div></div>
            <div class="result-card"><div class="value">${pct}%</div><div class="label">Точность</div></div>
            <div class="result-card"><div class="value">${state.practiceMode === 'waits' ? '🎯' : state.practiceMode === 'efficiency' ? '📊' : state.practiceMode === 'defense' ? '🛡️' : '📖'}</div><div class="label">Режим</div></div>
        </div>`;
    showScreen('results');
}
function finishLessonPractice() {
    const lp = state.lessonPractice; if (!lp) return;
    const prog = getLessonProgress(lp.lessonId);
    const passThreshold = Math.max(2, Math.ceil(lp.block.tasks.length * 0.6));
    const passed = state.correctCount >= passThreshold;
    if (passed) {
        if (!prog.blockPassed.includes(lp.blockIndex)) prog.blockPassed.push(lp.blockIndex);
        prog.currentBlock = lp.blockIndex + 1;
    }
    saveStore();
    const lessonId = lp.lessonId;
    state.lessonPractice = null;
    state.currentLesson = { id: lessonId, blockIndex: prog.currentBlock };
    setTimeout(() => {
        showScreen('lesson'); renderLesson();
        if (passed) showToast('✓ Блок пройден!');
        else showToast(`Блок не зачтён (нужно ${passThreshold}). Попробуйте ещё раз.`);
    }, 300);
}

/* ============ IMPORT / EXPORT ============ */
function exportProgress() {
    const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `mahjong-course-${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url); showToast('Прогресс экспортирован');
}
function importProgress(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try { const data = JSON.parse(e.target.result); if (typeof data !== 'object') throw new Error('Неверный формат'); store = { ...store, ...data }; saveStore(); updateHome(); showToast('Прогресс импортирован'); }
        catch (err) { showToast('Ошибка: ' + err.message); }
    };
    reader.readAsText(file);
}

/* ============ EVENTS ============ */
$('btn-open-course').addEventListener('click', () => { renderCourses(); showScreen('courses'); });
$('btn-open-glossary').addEventListener('click', () => { renderGlossCategories(); renderFullGlossary(); showScreen('glossary'); });
$('btn-glossary-back').addEventListener('click', () => { showScreen('home'); updateHome(); });
document.querySelectorAll('.practice-btn').forEach(b => b.addEventListener('click', () => startFreePractice(b.dataset.practice)));
$('btn-courses-back').addEventListener('click', () => { showScreen('home'); updateHome(); });
$('btn-lesson-back').addEventListener('click', () => { renderCourses(); showScreen('courses'); });
$('btn-back').addEventListener('click', () => {
    if (state.lessonPractice) {
        if (confirm('Прервать практику? Прогресс блока не будет засчитан.')) {
            state.lessonPractice = null;
            const lessonId = state.currentLesson ? state.currentLesson.id : null;
            if (lessonId) { state.currentLesson = { id: lessonId, blockIndex: getLessonProgress(lessonId).currentBlock }; showScreen('lesson'); renderLesson(); }
            else { showScreen('home'); updateHome(); }
        }
    } else { showScreen('home'); updateHome(); }
});
$('btn-clear').addEventListener('click', () => {
    if (state.answered) return;
    state.selectedTiles = new Set(); state.selectedIndices = new Set(); state.selectedDiscard = null;
    document.querySelectorAll('#hand .tile, #palette-area .tile').forEach(el => el.classList.remove('selected'));
    $('btn-check').disabled = true; updateClearButton();
});
$('btn-check').addEventListener('click', checkAnswer);
$('btn-next').addEventListener('click', nextQuestion);
$('btn-restart').addEventListener('click', () => { showScreen('home'); updateHome(); });
$('btn-open-settings').addEventListener('click', () => { updateHome(); showScreen('settings'); });
$('btn-settings-back').addEventListener('click', () => { showScreen('home'); updateHome(); });
$('btn-export').addEventListener('click', exportProgress);
$('btn-import').addEventListener('click', () => $('import-file').click());
$('import-file').addEventListener('change', (e) => { if (e.target.files[0]) importProgress(e.target.files[0]); e.target.value = ''; });
$('btn-reset-course').addEventListener('click', () => {
    if (confirm('Сбросить прогресс курса?')) { store.courseProgress = {}; saveStore(); updateHome(); showToast('Прогресс курса сброшен'); }
});
$('btn-reset-stats').addEventListener('click', () => {
    if (confirm('Сбросить статистику?')) { store.correct = 0; store.total = 0; store.tagStats = {}; saveStore(); updateHome(); showToast('Статистика сброшена'); }
});
/* Glossary search events */
const glossInput = $('glossSearchInput');
const glossClearBtn = $('glossClearBtn');
glossInput.addEventListener('input', (e) => {
    currentGlossQuery = e.target.value;
    glossClearBtn.style.display = currentGlossQuery ? 'inline-block' : 'none';
    renderFullGlossary();
});
glossClearBtn.addEventListener('click', () => {
    glossInput.value = ''; currentGlossQuery = '';
    glossClearBtn.style.display = 'none';
    renderFullGlossary();
    glossInput.focus();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        const cb = $('btn-check'), nb = $('btn-next');
        if (cb && cb.style.display !== 'none' && !cb.disabled) cb.click();
        else if (nb && nb.style.display !== 'none') nb.click();
    }
    if (e.key === 'Escape') {
        const cl = $('btn-clear'); if (cl && cl.style.display !== 'none') cl.click();
        if (document.activeElement === glossInput) {
            glossInput.value = ''; currentGlossQuery = '';
            glossClearBtn.style.display = 'none';
            renderFullGlossary();
        }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k' && $('screen-glossary').classList.contains('active')) {
        e.preventDefault(); glossInput.focus(); glossInput.select();
    }
});

updateHome();
</script>
